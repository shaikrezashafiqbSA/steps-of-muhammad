<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document Viewer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

  <style type="text/tailwindcss">
    /* ════════════════════════════════════════════════
       KFGQPC UTHMANIC HAFS — self-hosted
       ════════════════════════════════════════════════ */
    @font-face {
      font-family: 'UthmanicHafs';
      src: url('./fonts/UthmanicHafs1Ver18.ttf') format('truetype');
      font-display: swap;
    }

    /* ════════════════════════════════════════════════
       WARM TERRACOTTA MINIMALIST THEME
       ════════════════════════════════════════════════ */
    :root {
      --bg-cream:        #FFFBF1;
      --structural:      #7D5243;
      --divider-sand:    #E6DCD0;
      --text-espresso:   #3A2E2B;
      --text-taupe:      #7A6F6C;
      --accent-crimson:  #A94442;
      --accent-olive:    #3C763D;
      --accent-ochre:    #B08A4B;
    }

    html, body {
      background: var(--bg-cream);
      color: var(--text-espresso);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      letter-spacing: 0.01em;
      scroll-behavior: smooth;
    }

    .paper-card {
      background: var(--bg-cream);
      box-shadow:
        0 1px 2px rgba(125, 82, 67, 0.05),
        0 8px 24px rgba(125, 82, 67, 0.08);
      border: 1px solid var(--divider-sand);
      border-radius: 8px;
    }

    /* ════════════════════════════════════════════════
       MARKDOWN BODY TYPOGRAPHY
       ════════════════════════════════════════════════ */
    .markdown-body h1 {
      color: var(--structural);
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      margin-bottom: 0.5rem;
      padding-bottom: 0.75rem;
      border-bottom: 2px solid var(--divider-sand);
    }
    .markdown-body h2 {
      color: var(--accent-crimson);
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      margin-top: 2rem;
      margin-bottom: 0.75rem;
      padding-bottom: 0.25rem;
      border-bottom: 1px solid var(--divider-sand);
      scroll-margin-top: 1rem;
    }
    .markdown-body h3 {
      color: var(--structural);
      font-size: 1rem;
      font-weight: 600;
      margin-top: 1.25rem;
      margin-bottom: 0.5rem;
      scroll-margin-top: 1rem;
    }
    .markdown-body p {
      color: var(--text-espresso);
      font-size: 0.9rem;
      line-height: 1.7;
      margin-bottom: 1rem;
    }
    .markdown-body ul, .markdown-body ol {
      color: var(--text-espresso);
      font-size: 0.9rem;
      line-height: 1.7;
      margin-bottom: 1rem;
      padding-left: 1.5rem;
    }
    .markdown-body ul { list-style: disc; }
    .markdown-body ol { list-style: decimal; }
    .markdown-body li { margin-bottom: 0.35rem; }
    .markdown-body li strong { color: var(--accent-ochre); font-weight: 600; }
    .markdown-body strong { color: var(--structural); font-weight: 600; }
    .markdown-body em { color: var(--text-taupe); font-style: italic; }
    .markdown-body hr {
      border: none;
      border-top: 1px solid var(--divider-sand);
      margin: 2rem 0;
    }
    .markdown-body a {
      color: var(--accent-olive);
      text-decoration: underline;
      text-decoration-style: dotted;
      text-underline-offset: 3px;
    }
    .markdown-body a:hover { color: var(--accent-crimson); }

    .markdown-body blockquote {
      border-left: 3px solid var(--accent-ochre);
      background: rgba(176, 138, 75, 0.06);
      padding: 0.75rem 1rem;
      margin: 1rem 0;
      border-radius: 0 4px 4px 0;
      color: var(--text-espresso);
      font-style: italic;
      font-size: 0.92rem;
    }
    .markdown-body code {
      font-family: 'JetBrains Mono', 'Consolas', monospace;
      font-size: 0.82em;
      background: rgba(125, 82, 67, 0.08);
      color: var(--structural);
      padding: 0.1rem 0.35rem;
      border-radius: 3px;
    }

    /* ════════════════════════════════════════════════
       LEGACY HADITH META-CARD (kept for backward compat;
       v4.1+ doesn't render this — but if you ever revert,
       it still works)
       ════════════════════════════════════════════════ */
    .hadith-meta-card {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      background: linear-gradient(135deg, rgba(125, 82, 67, 0.06), rgba(176, 138, 75, 0.04));
      border: 1px solid var(--divider-sand);
      border-radius: 10px;
      padding: 1rem 1.15rem;
      margin-bottom: 1.5rem;
    }
    .hadith-meta-card .meta-left {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      flex: 1;
      min-width: 0;
    }
    .hadith-meta-card .meta-row {
      font-size: 0.78rem;
      color: var(--text-espresso);
      line-height: 1.4;
      word-wrap: break-word;
    }
    .hadith-meta-card .meta-label {
      font-weight: 600;
      color: var(--text-taupe);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-size: 0.62rem;
      margin-right: 0.4rem;
    }
    .hadith-meta-card .meta-value {
      font-weight: 500;
    }
    .hadith-meta-card .grade-badge {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 78px;
      padding: 0.5rem 0.7rem;
      border-radius: 8px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      flex-shrink: 0;
    }
    .hadith-meta-card .grade-badge .grade-icon {
      font-size: 1.1rem;
      line-height: 1;
      margin-bottom: 0.2rem;
    }
    .hadith-meta-card .grade-badge .grade-text {
      font-size: 0.65rem;
      line-height: 1.1;
    }
    .grade-sahih     { background: #3C763D; color: #FFFBF1; }
    .grade-hasan     { background: #2C7BB0; color: #FFFBF1; }
    .grade-daif      { background: #B08A4B; color: #FFFBF1; }
    .grade-mawdu     { background: #A94442; color: #FFFBF1; }
    .grade-mutawatir { background: #2D5F2D; color: #FFFBF1; }
    .grade-unknown   { background: #7A6F6C; color: #FFFBF1; }

    /* ════════════════════════════════════════════════
       POKÉMON-CARD ORB BAR (v4.1)
       Top-of-page pill bar replacing return/header
       Two pills: left (source/citation) + right (grade/authenticity)
       Author has full explicit control over content via
       ::meta left-orb: ... · right-orb: ...
       ════════════════════════════════════════════════ */

    :root {
      --orb-font-size: 0.72rem;
      --orb-padding-y: 0.4rem;
      --orb-padding-x: 0.85rem;
      --orb-radius: 999px;
    }

    .orb-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      padding: 0.25rem 0;
      margin-bottom: 0.5rem;
    }

    .orb {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: var(--orb-font-size);
      font-weight: 600;
      letter-spacing: 0.02em;
      padding: var(--orb-padding-y) var(--orb-padding-x);
      border-radius: var(--orb-radius);
      box-shadow: 0 1px 3px rgba(125, 82, 67, 0.1);
      white-space: nowrap;
      max-width: 100%;
    }

    .orb-left {
      background: rgba(125, 82, 67, 0.08);
      color: var(--text-espresso);
      border: 1px solid var(--divider-sand);
    }

    .orb-right {
      color: #FFFBF1;
      border: 1px solid transparent;
    }
    .orb-right-sahih     { background: #3C763D; }
    .orb-right-hasan     { background: #2C7BB0; }
    .orb-right-daif      { background: #B08A4B; }
    .orb-right-mawdu     { background: #A94442; }
    .orb-right-mutawatir { background: #2D5F2D; }
    .orb-right-neutral   {
      background: rgba(125, 82, 67, 0.08);
      color: var(--text-espresso);
      border: 1px solid var(--divider-sand);
    }

    @media (max-width: 640px) {
      :root {
        --orb-font-size: 0.66rem;
        --orb-padding-y: 0.35rem;
        --orb-padding-x: 0.7rem;
      }
      .orb {
        gap: 0.25rem;
      }
    }

    /* ════════════════════════════════════════════════
       FLOATING TOC PANEL (v4.1)
       Lives below Reading Mode, outside paper-card
       Collapsed by default; toggle reveals overlay panel
       ════════════════════════════════════════════════ */

    .toc-floating-toggle {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--structural);
      background: rgba(230, 220, 208, 0.5);
      border: 1px solid var(--divider-sand);
      padding: 0.4rem 0.85rem;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.18s ease, border-color 0.18s ease;
      font-family: 'Inter', sans-serif;
    }
    .toc-floating-toggle:hover {
      background: rgba(176, 138, 75, 0.15);
      border-color: rgba(176, 138, 75, 0.4);
    }
    .toc-floating-toggle .toc-toggle-icon {
      font-size: 0.6rem;
      color: var(--text-taupe);
      transition: transform 0.2s ease;
    }
    .toc-floating-toggle.toc-open .toc-toggle-icon {
      transform: rotate(180deg);
    }

    .toc-floating-panel {
      position: absolute;
      top: calc(100% + 0.4rem);
      left: 0;
      right: 0;
      max-width: 22rem;
      background: var(--bg-cream);
      border: 1px solid var(--divider-sand);
      border-radius: 8px;
      box-shadow:
        0 4px 12px rgba(125, 82, 67, 0.1),
        0 12px 36px rgba(125, 82, 67, 0.12);
      padding: 0.85rem 1.1rem;
      z-index: 50;
      max-height: 70vh;
      overflow-y: auto;
    }

    .toc-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .toc-list li { margin: 0; padding: 0; }
    .toc-list a {
      display: block;
      padding: 0.4rem 0.5rem;
      font-size: 0.82rem;
      color: var(--text-espresso);
      text-decoration: none;
      border-radius: 4px;
      border-left: 2px solid transparent;
      transition: all 0.15s ease;
    }
    .toc-list a:hover {
      background: rgba(125, 82, 67, 0.08);
      border-left-color: var(--structural);
      color: var(--structural);
    }
    .toc-list .toc-h2 { font-weight: 600; }
    .toc-list .toc-h3 a {
      padding-left: 1.5rem;
      font-size: 0.76rem;
      color: var(--text-taupe);
    }

    /* ════════════════════════════════════════════════
       ZOOM ENGINE (v4.2)
       5 levels · default = 3 (current sizing)
       Persisted via localStorage
       Scales: word-stack Arabic, gloss, translit, body text,
               h1, h2, paper card padding
       ════════════════════════════════════════════════ */

    body[data-zoom="1"] {
      --zoom-arabic:  0.70;
      --zoom-text:    0.78;
      --zoom-spacing: 0.65;
    }
    body[data-zoom="2"] {
      --zoom-arabic:  0.85;
      --zoom-text:    0.90;
      --zoom-spacing: 0.82;
    }
    body[data-zoom="3"] {
      --zoom-arabic:  1.00;
      --zoom-text:    1.00;
      --zoom-spacing: 1.00;
    }
    body[data-zoom="4"] {
      --zoom-arabic:  1.18;
      --zoom-text:    1.12;
      --zoom-spacing: 1.15;
    }
    body[data-zoom="5"] {
      --zoom-arabic:  1.40;
      --zoom-text:    1.25;
      --zoom-spacing: 1.30;
    }

    body { --zoom-arabic: 1; --zoom-text: 1; --zoom-spacing: 1; }

    body[data-zoom] .markdown-body .ayah .w > b {
      font-size: calc(2.1rem * var(--zoom-arabic));
    }
    body[data-zoom][data-mode="arabic-first"] .ayah .w > b {
      font-size: calc(2.3rem * var(--zoom-arabic));
    }
    body[data-zoom][data-mode="arabic-only"] .ayah .w > b {
      font-size: calc(2.6rem * var(--zoom-arabic));
    }
    body[data-zoom][data-mode="verbal"] .ayah .w > b {
      font-size: calc(1.6rem * var(--zoom-arabic));
    }

    body[data-zoom] .markdown-body .ayah .w > i {
      font-size: calc(0.78rem * var(--zoom-text));
    }
    body[data-zoom] .markdown-body .ayah .w > u {
      font-size: calc(0.7rem * var(--zoom-text));
    }
    body[data-zoom][data-mode="verbal"] .ayah .w > u {
      font-size: calc(1rem * var(--zoom-text));
    }

    body[data-zoom] .markdown-body p,
    body[data-zoom] .markdown-body ul,
    body[data-zoom] .markdown-body ol {
      font-size: calc(0.9rem * var(--zoom-text));
    }
    body[data-zoom] .markdown-body blockquote {
      font-size: calc(0.92rem * var(--zoom-text));
    }
    body[data-zoom] .markdown-body h1 {
      font-size: calc(1.75rem * var(--zoom-text));
    }
    body[data-zoom] .markdown-body h2 {
      font-size: calc(1.25rem * var(--zoom-text));
    }
    body[data-zoom] .markdown-body h3 {
      font-size: calc(1rem * var(--zoom-text));
    }

    body[data-zoom] .markdown-body .ayah {
      padding: calc(1.4rem * var(--zoom-spacing)) calc(1.1rem * var(--zoom-spacing)) calc(1.1rem * var(--zoom-spacing));
      gap: calc(0.4rem * var(--zoom-spacing)) calc(0.85rem * var(--zoom-spacing));
      margin: calc(1.5rem * var(--zoom-spacing)) 0;
    }
    body[data-zoom] .markdown-body .ayah .w {
      min-width: calc(60px * var(--zoom-spacing));
      padding: calc(0.35rem * var(--zoom-spacing)) calc(0.25rem * var(--zoom-spacing));
    }

    /* ════════════════════════════════════════════════
       ZOOM TOGGLE CONTROL — matches Reading Mode style
       ════════════════════════════════════════════════ */
    .zoom-toggle {
      display: inline-flex;
      align-items: center;
      background: rgba(230, 220, 208, 0.4);
      border: 1px solid var(--divider-sand);
      border-radius: 6px;
      padding: 3px;
      gap: 2px;
    }
    .zoom-btn {
      width: 1.85rem;
      height: 1.65rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-taupe);
      background: transparent;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.18s ease;
      font-family: 'Inter', sans-serif;
      user-select: none;
    }
    .zoom-btn:hover:not(:disabled) {
      color: var(--structural);
      background: rgba(125, 82, 67, 0.06);
    }
    .zoom-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
    .zoom-level-indicator {
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--structural);
      padding: 0 0.5rem;
      letter-spacing: 0.08em;
      min-width: 2.2rem;
      text-align: center;
      user-select: none;
    }

    @media (max-width: 640px) {
      .zoom-btn { width: 1.6rem; height: 1.5rem; font-size: 0.78rem; }
      .zoom-level-indicator { font-size: 0.6rem; min-width: 1.8rem; padding: 0 0.35rem; }
    }

    /* ════════════════════════════════════════════════
       AYAH BLOCK — Quran-app style word-grid
       ════════════════════════════════════════════════ */
    .markdown-body .ayah {
      direction: rtl;
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-start;
      align-items: flex-start;
      gap: 0.4rem 0.85rem;
      background: rgba(230, 220, 208, 0.22);
      border: 1px solid var(--divider-sand);
      border-radius: 10px;
      padding: 1.4rem 1.1rem 1.1rem;
      margin: 1.5rem 0;
    }

    .markdown-body .ayah .w {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      text-align: center;
      min-width: 60px;
      padding: 0.35rem 0.25rem;
      border-radius: 6px;
      transition: background 0.15s ease;
    }
    .markdown-body .ayah .w:hover {
      background: rgba(125, 82, 67, 0.06);
    }

    .markdown-body .ayah .w > b {
      font-family: 'UthmanicHafs', 'Amiri Quran', 'Scheherazade New', serif;
      font-weight: 400;
      font-size: 2.1rem;
      line-height: 2.6;
      color: var(--text-espresso);
      direction: rtl;
      letter-spacing: 0;
    }

    .markdown-body .ayah .w > i {
      font-family: 'Inter', sans-serif;
      font-style: normal;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--text-espresso);
      direction: ltr;
      margin-top: 0.15rem;
      line-height: 1.3;
      max-width: 130px;
    }

    .markdown-body .ayah .w > u {
      font-family: 'Inter', sans-serif;
      text-decoration: none;
      font-style: italic;
      font-size: 0.7rem;
      color: var(--accent-ochre);
      direction: ltr;
      margin-top: 0.1rem;
      line-height: 1.3;
      letter-spacing: 0.02em;
      max-width: 130px;
    }

    /* ════════════════════════════════════════════════
       READING MODES
       ════════════════════════════════════════════════ */
    body[data-mode="arabic-first"] .ayah .w > u { display: none; }
    body[data-mode="arabic-first"] .ayah .w > b { font-size: 2.3rem; }

    body[data-mode="verbal"] .ayah .w > b {
      font-size: 1.6rem;
      opacity: 0.65;
      line-height: 2.2;
    }
    body[data-mode="verbal"] .ayah .w > u {
      font-size: 1rem;
      font-style: normal;
      font-weight: 600;
      color: var(--text-espresso);
      order: -1;
      margin-top: 0;
      margin-bottom: 0.2rem;
    }

    body[data-mode="arabic-only"] .ayah .w > i,
    body[data-mode="arabic-only"] .ayah .w > u { display: none; }
    body[data-mode="arabic-only"] .ayah .w > b {
      font-size: 2.6rem;
      line-height: 2.8;
    }
    body[data-mode="arabic-only"] .ayah {
      padding: 1.6rem 1.2rem;
      gap: 0.6rem 1.2rem;
    }

    /* ════════════════════════════════════════════════
       MODE TOGGLE
       ════════════════════════════════════════════════ */
    .mode-toggle {
      display: inline-flex;
      flex-wrap: wrap;
      background: rgba(230, 220, 208, 0.4);
      border: 1px solid var(--divider-sand);
      border-radius: 6px;
      padding: 3px;
      gap: 2px;
    }
    .mode-btn {
      padding: 0.4rem 0.7rem;
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: var(--text-taupe);
      background: transparent;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.18s ease;
      font-family: 'Inter', sans-serif;
    }
    .mode-btn:hover { color: var(--structural); }
    .mode-btn.active {
      background: var(--structural);
      color: var(--bg-cream);
      box-shadow: 0 1px 3px rgba(125, 82, 67, 0.25);
    }

    /* ════════════════════════════════════════════════
       COLLAPSIBLE DETAILS — Hadith narration drawer
       ════════════════════════════════════════════════ */
    .markdown-body details {
      background: rgba(125, 82, 67, 0.04);
      border: 1px solid var(--divider-sand);
      border-left: 3px solid var(--accent-ochre);
      border-radius: 6px;
      padding: 0.85rem 1rem;
      margin: 1.25rem 0;
      transition: background 0.18s ease;
    }
    .markdown-body details[open] {
      background: rgba(230, 220, 208, 0.18);
    }
    .markdown-body summary {
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      color: var(--structural);
      user-select: none;
      padding: 0.15rem 0;
      list-style: none;
    }
    .markdown-body summary::-webkit-details-marker { display: none; }
    .markdown-body summary::before {
      content: '▶';
      display: inline-block;
      margin-right: 0.5rem;
      font-size: 0.65rem;
      color: var(--accent-ochre);
      transition: transform 0.2s ease;
    }
    .markdown-body details[open] summary::before {
      transform: rotate(90deg);
    }
    .markdown-body details > *:not(summary) {
      margin-top: 0.85rem;
    }
    .markdown-body details .ayah {
      background: rgba(230, 220, 208, 0.35);
    }
    .markdown-body details blockquote {
      background: rgba(125, 82, 67, 0.04);
      font-size: 0.85rem;
    }

    /* ════════════════════════════════════════════════
       MOBILE TIGHTENING
       ════════════════════════════════════════════════ */
    @media (max-width: 640px) {
      .markdown-body h1 { font-size: 1.4rem; }
      .markdown-body h2 { font-size: 1.1rem; }
      .mode-btn { padding: 0.3rem 0.5rem; font-size: 0.62rem; }

      .markdown-body .ayah { padding: 1rem 0.7rem 0.8rem; gap: 0.3rem 0.5rem; }
      .markdown-body .ayah .w { min-width: 50px; padding: 0.25rem 0.15rem; }
      .markdown-body .ayah .w > b { font-size: 1.75rem; line-height: 2.4; }

      body[data-mode="arabic-first"] .ayah .w > b { font-size: 1.95rem; }
      body[data-mode="arabic-only"] .ayah .w > b { font-size: 2.2rem; line-height: 2.6; }
      body[data-mode="verbal"] .ayah .w > b { font-size: 1.35rem; }
      body[data-mode="verbal"] .ayah .w > u { font-size: 0.85rem; }

      .markdown-body .ayah .w > i { font-size: 0.72rem; max-width: 95px; }
      .markdown-body .ayah .w > u { font-size: 0.64rem; max-width: 95px; }
    }
  </style>
</head>
<body data-mode="arabic-first" class="min-h-screen antialiased">

  <main class="max-w-3xl mx-auto px-4 sm:px-6 py-8">

    <!-- ────────── Pokémon-card orb bar (injected by parser) ────────── -->
    <div id="orb-bar-target" class="mb-4"></div>

    <!-- Mode toggle + Zoom -->
    <div class="flex flex-wrap items-center gap-3 mb-3">
      <span class="text-[10px] font-semibold tracking-widest uppercase" style="color: var(--text-taupe);">
        Reading Mode
      </span>
      <div class="mode-toggle" id="modeToggle">
        <button class="mode-btn active" data-set="arabic-first">Arabic-first</button>
        <button class="mode-btn" data-set="learner">Learner</button>
        <button class="mode-btn" data-set="verbal">Verbal</button>
        <button class="mode-btn" data-set="arabic-only">Arabic-only</button>
      </div>

      <span class="text-[10px] font-semibold tracking-widest uppercase ml-1" style="color: var(--text-taupe);">
        Zoom
      </span>
      <div class="zoom-toggle" id="zoomToggle">
        <button class="zoom-btn" id="zoomOut" title="Zoom out — see more">−</button>
        <span class="zoom-level-indicator" id="zoomLevel">3/5</span>
        <button class="zoom-btn" id="zoomIn" title="Zoom in — read larger">+</button>
      </div>
    </div>

    <!-- ────────── Floating TOC (anchored below Reading Mode, collapsed by default) ────────── -->
    <div id="toc-floating-wrap" class="relative mb-4">
      <button id="tocToggleBtn" type="button" class="toc-floating-toggle" style="display:none;">
        <span>📑 Contents</span>
        <span class="toc-toggle-icon">▼</span>
      </button>
      <nav id="toc" class="toc-floating-panel" style="display:none;">
        <ul class="toc-list" id="tocList"></ul>
      </nav>
    </div>

    <!-- Markdown content -->
    <article class="paper-card p-6 sm:p-10">
      <div id="markdown-target" class="markdown-body">
        <p class="text-xs italic" style="color: var(--text-taupe);">Loading content...</p>
      </div>
    </article>

  </main>

  <footer class="text-center text-[10px] font-semibold tracking-widest uppercase py-6" style="color: var(--text-taupe);">
    Steps of Muhammad · Paper Reader
  </footer>

  <script>
    // ════════════════════════════════════════════
    // Mode toggle with localStorage persistence
    // ════════════════════════════════════════════
    const MODE_KEY = 'tahlil-reading-mode';
    const savedMode = localStorage.getItem(MODE_KEY) || 'arabic-first';
    document.body.setAttribute('data-mode', savedMode);

    document.querySelectorAll('.mode-btn').forEach(btn => {
      if (btn.dataset.set === savedMode) btn.classList.add('active');
      else btn.classList.remove('active');

      btn.addEventListener('click', () => {
        const mode = btn.dataset.set;
        document.body.setAttribute('data-mode', mode);
        localStorage.setItem(MODE_KEY, mode);
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });

    // ════════════════════════════════════════════
    // Zoom engine v4.2
    //   5 levels (1 = smallest, 3 = default, 5 = largest)
    //   Persisted via localStorage
    //   Scales: word-stack Arabic, gloss, translit, body, headings
    //   Keyboard: Ctrl/Cmd + +/- (zoom), Ctrl/Cmd + 0 (reset)
    // ════════════════════════════════════════════
    const ZOOM_KEY = 'tahlil-zoom-level';
    const ZOOM_MIN = 1, ZOOM_MAX = 5, ZOOM_DEFAULT = 3;

    function getCurrentZoom() {
      const raw = parseInt(localStorage.getItem(ZOOM_KEY), 10);
      if (isNaN(raw) || raw < ZOOM_MIN || raw > ZOOM_MAX) return ZOOM_DEFAULT;
      return raw;
    }

    function applyZoom(level) {
      const clamped = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, level));
      document.body.setAttribute('data-zoom', clamped);
      localStorage.setItem(ZOOM_KEY, clamped);

      const indicator = document.getElementById('zoomLevel');
      const btnOut    = document.getElementById('zoomOut');
      const btnIn     = document.getElementById('zoomIn');

      if (indicator) indicator.textContent = `${clamped}/${ZOOM_MAX}`;
      if (btnOut)    btnOut.disabled = (clamped <= ZOOM_MIN);
      if (btnIn)     btnIn.disabled  = (clamped >= ZOOM_MAX);
    }

    applyZoom(getCurrentZoom());

    document.getElementById('zoomOut')?.addEventListener('click', () => {
      applyZoom(getCurrentZoom() - 1);
    });
    document.getElementById('zoomIn')?.addEventListener('click', () => {
      applyZoom(getCurrentZoom() + 1);
    });

    document.addEventListener('keydown', (e) => {
      if (!(e.ctrlKey || e.metaKey)) return;
      if (e.key === '-' || e.key === '_') {
        e.preventDefault();
        applyZoom(getCurrentZoom() - 1);
      } else if (e.key === '=' || e.key === '+') {
        e.preventDefault();
        applyZoom(getCurrentZoom() + 1);
      } else if (e.key === '0') {
        e.preventDefault();
        applyZoom(ZOOM_DEFAULT);
      }
    });

    // ════════════════════════════════════════════
    // Slugify helper (used by TOC)
    // ════════════════════════════════════════════
    function slugify(text) {
      return text.toLowerCase()
        .replace(/[^\w\s-]/g, '')
        .replace(/\s+/g, '-')
        .replace(/-+/g, '-')
        .trim();
    }

    // ════════════════════════════════════════════
    // Meta-card parser v4.1
    //   Option A: full explicit left-orb + right-orb fields
    //   Old fields (narrator/collection/book/hadith) parsed
    //   but kept hidden — preserved as data-* attrs for future use
    // ════════════════════════════════════════════
    function parseMetaBlock(mdSource) {
      const metaRe = /^::meta\s*\n([\s\S]*?)\n::\s*\n?/m;
      const match = mdSource.match(metaRe);
      if (!match) return { meta: null, stripped: mdSource };

      const lines = match[1].split('\n');
      const meta = {};
      lines.forEach(line => {
        const idx = line.indexOf(':');
        if (idx === -1) return;
        const key = line.slice(0, idx).trim().toLowerCase();
        const val = line.slice(idx + 1).trim();
        if (key) meta[key] = val;
      });

      const stripped = mdSource.replace(metaRe, '');
      return { meta, stripped };
    }

    function renderMetaCard(meta) {
      if (!meta) return '';

      const leftOrb  = meta['left-orb']  || '';
      const rightOrb = meta['right-orb'] || (meta.grade ? meta.grade.toUpperCase() : '');

      const hiddenData = [];
      ['narrator', 'collection', 'book', 'hadith', 'grade', 'verify'].forEach(key => {
        if (meta[key]) hiddenData.push(`data-${key}="${meta[key].replace(/"/g, '&quot;')}"`);
      });

      const rightLower = rightOrb.toLowerCase();
      let rightColorClass = 'orb-right-neutral';
      if (rightLower.includes('ṣaḥīḥ') || rightLower.includes('sahih')) rightColorClass = 'orb-right-sahih';
      else if (rightLower.includes('ḥasan') || rightLower.includes('hasan')) rightColorClass = 'orb-right-hasan';
      else if (rightLower.includes('ḍaʿīf') || rightLower.includes('daif')) rightColorClass = 'orb-right-daif';
      else if (rightLower.includes('mawḍūʿ') || rightLower.includes('mawdu')) rightColorClass = 'orb-right-mawdu';
      else if (rightLower.includes('mutawātir') || rightLower.includes('mutawatir')) rightColorClass = 'orb-right-mutawatir';

      if (!leftOrb && !rightOrb) return '';

      return `
        <div class="orb-bar" ${hiddenData.join(' ')}>
          ${leftOrb  ? `<span class="orb orb-left">${leftOrb}</span>`  : '<span></span>'}
          ${rightOrb ? `<span class="orb orb-right ${rightColorClass}">${rightOrb}</span>` : ''}
        </div>`;
    }

    // ════════════════════════════════════════════
    // Word-stack parser
    //   [[arabic|english|translit]]  →  <span class="w"><b>...</b><i>...</i><u>...</u></span>
    // ════════════════════════════════════════════
    function parseWordStacks(rootEl) {
      const html = rootEl.innerHTML;
      const wordRe = /(?<!\\)\[\[([^\[\]|]+)(?:\|([^\[\]|]*))?(?:\|([^\[\]|]*))?\]\]/g;

      const transformed = html.replace(wordRe, (match, ar, en, tr) => {
        const arabic = (ar || '').trim();
        const english = (en || '').trim();
        const translit = (tr || '').trim();
        let inner = `<b>${arabic}</b>`;
        if (english) inner += `<i>${english}</i>`;
        if (translit) inner += `<u>${translit}</u>`;
        return `<span class="w">${inner}</span>`;
      })
      .replace(/\\\[\[/g, '[[');

      rootEl.innerHTML = transformed;
      groupAyahs(rootEl);
    }

    function groupAyahs(rootEl) {
      const allW = Array.from(rootEl.querySelectorAll('span.w'));
      let i = 0;
      while (i < allW.length) {
        const first = allW[i];
        if (first.closest('.ayah')) { i++; continue; }

        const group = [first];
        let next = first.nextSibling;
        while (next) {
          if (next.nodeType === Node.TEXT_NODE && next.textContent.trim() === '') {
            next = next.nextSibling;
            continue;
          }
          if (next.nodeType === Node.ELEMENT_NODE && next.classList && next.classList.contains('w')) {
            group.push(next);
            next = next.nextSibling;
            continue;
          }
          break;
        }

        const ayah = document.createElement('div');
        ayah.className = 'ayah';
        first.parentNode.insertBefore(ayah, first);
        group.forEach(node => ayah.appendChild(node));

        i += group.length;
      }

      rootEl.querySelectorAll('p > .ayah').forEach(ayah => {
        const p = ayah.parentNode;
        const onlyChild = Array.from(p.childNodes).every(n =>
          n === ayah || (n.nodeType === Node.TEXT_NODE && n.textContent.trim() === '')
        );
        if (onlyChild) {
          p.parentNode.insertBefore(ayah, p);
          p.remove();
        } else {
          p.parentNode.insertBefore(ayah, p.nextSibling);
        }
      });
    }

    // ════════════════════════════════════════════
    // TOC builder v4.1
    //   Anchored to floating panel below Reading Mode
    //   Hidden by default; click toggle to show overlay
    // ════════════════════════════════════════════
    function buildTOC(target) {
      const tocPanel = document.getElementById('toc');
      const tocList  = document.getElementById('tocList');
      const tocBtn   = document.getElementById('tocToggleBtn');
      const headings = target.querySelectorAll('h2, h3');

      if (headings.length < 2) {
        if (tocPanel) tocPanel.style.display = 'none';
        if (tocBtn)   tocBtn.style.display   = 'none';
        return;
      }

      tocList.innerHTML = '';
      headings.forEach((h, i) => {
        if (!h.id) h.id = slugify(h.textContent) || `section-${i}`;
        const li = document.createElement('li');
        li.className = h.tagName === 'H2' ? 'toc-h2' : 'toc-h3';
        const a = document.createElement('a');
        a.href = `#${h.id}`;
        a.textContent = h.textContent;

        a.addEventListener('click', () => {
          const heading = document.getElementById(h.id);
          if (heading) {
            let node = heading.nextElementSibling;
            while (node && !['H1','H2','H3'].includes(node.tagName)) {
              if (node.tagName === 'DETAILS') node.open = true;
              if (node.querySelectorAll) node.querySelectorAll('details').forEach(d => d.open = true);
              node = node.nextElementSibling;
            }
            const parentDetails = heading.closest('details');
            if (parentDetails) parentDetails.open = true;
          }
          closeTOC();
        });

        li.appendChild(a);
        tocList.appendChild(li);
      });

      tocBtn.style.display = 'inline-flex';

      tocBtn.onclick = (e) => {
        e.stopPropagation();
        if (tocPanel.style.display === 'block') closeTOC();
        else openTOC();
      };

      document.addEventListener('click', (e) => {
        if (tocPanel.style.display === 'block' &&
            !tocPanel.contains(e.target) &&
            e.target !== tocBtn &&
            !tocBtn.contains(e.target)) {
          closeTOC();
        }
      });
    }

    function openTOC() {
      const tocPanel = document.getElementById('toc');
      const tocBtn   = document.getElementById('tocToggleBtn');
      if (tocPanel) tocPanel.style.display = 'block';
      if (tocBtn) tocBtn.classList.add('toc-open');
    }

    function closeTOC() {
      const tocPanel = document.getElementById('toc');
      const tocBtn   = document.getElementById('tocToggleBtn');
      if (tocPanel) tocPanel.style.display = 'none';
      if (tocBtn) tocBtn.classList.remove('toc-open');
    }

    // ════════════════════════════════════════════
    // Auto-expand <details> when URL hash targets one
    // ════════════════════════════════════════════
    function handleHashOpen() {
      if (!window.location.hash) return;
      setTimeout(() => {
        const targetEl = document.querySelector(window.location.hash);
        if (!targetEl) return;
        let parent = targetEl.closest('details');
        while (parent) {
          parent.open = true;
          parent = parent.parentElement ? parent.parentElement.closest('details') : null;
        }
        targetEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 100);
    }

    // ════════════════════════════════════════════
    // Markdown fetch & render
    // ════════════════════════════════════════════
    document.addEventListener('DOMContentLoaded', async () => {
      const params = new URLSearchParams(window.location.search);
      const file = params.get('file');
      const target = document.getElementById('markdown-target');

      if (!file) {
        target.innerHTML = `<p style="color: var(--accent-crimson);">⚠️ No file specified. Append <code>?file=yourfile.md</code> to the URL.</p>`;
        return;
      }

      try {
        const res = await fetch(file);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const md = await res.text();

        marked.setOptions({ gfm: true, breaks: false });
        const { meta, stripped } = parseMetaBlock(md);
        const metaCardHTML = renderMetaCard(meta);

        const orbTarget = document.getElementById('orb-bar-target');
        if (orbTarget) orbTarget.innerHTML = metaCardHTML;

        target.innerHTML = marked.parse(stripped);

        parseWordStacks(target);
        buildTOC(target);
        handleHashOpen();

        const h1 = target.querySelector('h1');
        if (h1) document.title = h1.textContent;
      } catch (err) {
        console.error(err);
        target.innerHTML = `
          <p style="color: var(--accent-crimson);">
            ⚠️ <strong>Could not load file:</strong> <code>${file}</code><br>
            <span style="color: var(--text-taupe); font-size: 0.85em;">Check the path and that the file exists relative to this HTML.</span>
          </p>`;
      }
    });

    document.fonts.ready.then(() => {
      const hasUthmanic = Array.from(document.fonts).some(f => f.family.includes('UthmanicHafs') && f.status === 'loaded');
      if (!hasUthmanic) {
        console.info('ℹ️  KFGQPC UthmanicHafs not found at ./fonts/UthmanicHafs1Ver18.ttf — falling back to Amiri Quran.');
      }
    });
  </script>
</body>
</html>
