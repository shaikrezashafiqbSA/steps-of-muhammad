# Praising Allah After Eating — Forgiveness of Past Sins

## 📜 The Hadith

Muʿādh ibn Anas ؓ reported: The Messenger of Allah ﷺ said, "Whoever eats food and then says: *Al-ḥamdu lillāhi-lladhī aṭʿamanī hādhā, wa razaqanīhi min ghayri ḥawlin minnī wa lā quwwatin* — 'All praise is due to Allah Who has fed me this and provided it for me without any might or power on my part' — his past sins will be forgiven."

## الضَّمَان ۞ Allah's Guarantee

The text attaches an explicit outcome to the act of praising Allah after eating: the one who says these words after food has his past sins forgiven.

The condition:

[[ مَنْ | Whoever | man ]]
[[ أَكَلَ | eats | akala ]]
[[ طَعَامًا | food | ṭaʿāman ]]
[[ فَقَالَ | then says | fa-qāla ]]

The result:

[[ غُفِرَ | will be forgiven | ghufira ]]
[[ لَهُ | for him | lahu ]]
[[ مَا | what | mā ]]
[[ تَقَدَّمَ | preceded | taqaddama ]]
[[ مِنْ | of | min ]]
[[ ذَنْبِهِ | his sin | dhanbihi ]]

<details>
<summary>۞ الْحِكْمَة — Divine Wisdom</summary>

> **Source: Textual.** This reading follows from the wording of the text itself.

The supplication is structured in two movements: an act of praise [[ الْحَمْدُ لِلَّهِ | All praise is due to Allah | al-ḥamdu lillāhi ]] followed by a confession of inability [[ مِنْ غَيْرِ حَوْلٍ مِنِّي وَلَا قُوَّةٍ | without any might or power on my part | min ghayri ḥawlin minnī wa-lā quwwatin ]]. The text pairs gratitude upward with humility inward — the eater names Allah as the true provider while explicitly disowning the two things people most often credit themselves with: strength (ḥawl) and capability (quwwah).

The wording of the result mirrors this: the passive verb [[ غُفِرَ | it was forgiven | ghufira ]] carries no mention of the eater's effort, just as the duʿāʾ carried no mention of the eater's power. What is given without the servant's might is matched by forgiveness without the servant's earning — the structure of the reward echoes the structure of the words.

</details>

  <script>
    const KEY = 'som-card-builder-draft';
    const editor = document.getElementById('editor');
    const frame = document.getElementById('frame');
    let ready = false, timer = null;

    // localStorage can throw (private windows, blocked site data)
    const store = {
      get() { try { return localStorage.getItem(KEY); } catch (e) { return null; } },
      set(v) { try { localStorage.setItem(KEY, v); } catch (e) {} }
    };
    const sampleMd = () => document.getElementById('sample-md').textContent.replace(/^\n/, '').replace(/\s+$/, '\n');

    const caretLine = () => editor.value.slice(0, editor.selectionStart).split('\n').length;
    let lastLine = 0;

    function push() {
      document.getElementById('count').textContent = editor.value ? editor.value.split('\n').length + ' lines' : '';
      if (ready) frame.contentWindow.postMessage({ type: 'som-preview', md: editor.value, line: document.activeElement === editor ? caretLine() : 0 }, '*');
    }

    // Tell the preview which line the caret is on so it can highlight it.
    function syncCaret() {
      if (!ready || document.activeElement !== editor) return;
      const n = caretLine();
      if (n === lastLine) return;
      lastLine = n;
      frame.contentWindow.postMessage({ type: 'som-focus', line: n }, '*');
    }
    document.addEventListener('selectionchange', syncCaret);
    let fromPreview = false;
    editor.addEventListener('focus', () => { if (fromPreview) return; lastLine = 0; syncCaret(); });
    function schedule() {
      clearTimeout(timer);
      timer = setTimeout(() => { store.set(editor.value); push(); }, 250);
    }
    function setText(t) { editor.value = t; store.set(t); push(); }

    // Click in the preview → select the matching source line in the editor.
    function gotoLine(n) {
      const lines = editor.value.split('\n');
      n = Math.max(1, Math.min(n, lines.length));
      let start = 0;
      for (let i = 0; i < n - 1; i++) start += lines[i].length + 1;
      if (getComputedStyle(editor).display === 'none' || !editor.offsetParent) return;   // narrow screen: editor is on the other tab
      // The preview already highlighted what was clicked; don't let the editor's
      // focus event echo the *old* caret line back and move the highlight/scroll.
      fromPreview = true;
      editor.focus({ preventScroll: true });
      editor.setSelectionRange(start, start + lines[n - 1].length);
      lastLine = n;
      editor.scrollTop = Math.max(0, offsetOfLine(start) - editor.clientHeight / 2);
      setTimeout(() => { fromPreview = false; }, 0);
    }

    // Pixel offset of a character index, accounting for soft-wrapped lines
    // (long duas wrap, so n × line-height would drift).
    function offsetOfLine(idx) {
      const cs = getComputedStyle(editor);
      const m = document.createElement('div');
      m.style.cssText = 'position:absolute;visibility:hidden;white-space:pre-wrap;overflow-wrap:break-word;top:0;left:-9999px;';
      ['fontFamily', 'fontSize', 'lineHeight', 'letterSpacing', 'tabSize', 'paddingLeft', 'paddingRight', 'borderLeftWidth', 'borderRightWidth']
        .forEach(p => { m.style[p] = cs[p]; });
      m.style.width = editor.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) + 'px';
      m.style.paddingLeft = m.style.paddingRight = '0';
      m.textContent = editor.value.slice(0, idx) + '​';
      document.body.appendChild(m);
      const h = m.offsetHeight - (parseFloat(cs.lineHeight) || 0);
      m.remove();
      return h + parseFloat(cs.paddingTop);
    }

    window.addEventListener('message', (e) => {
      if (e.source !== frame.contentWindow || !e.data) return;
      if (e.data.type === 'som-preview-ready') { ready = true; push(); }
      else if (e.data.type === 'som-goto') gotoLine(e.data.line);
    });

    editor.addEventListener('input', schedule);
    editor.addEventListener('keydown', (e) => {
      if (e.key === 'Tab') { e.preventDefault(); document.execCommand('insertText', false, '  '); }
    });

    document.getElementById('sample').onclick = () => setText(sampleMd());
    document.getElementById('clear').onclick = () => { if (!editor.value || confirm('Clear the editor?')) setText(''); };
    document.getElementById('paste').onclick = async () => {
      try { setText(await navigator.clipboard.readText()); }
      catch (e) { editor.focus(); alert('Clipboard access was blocked. Press Ctrl+V in the editor instead.'); }
    };
    const file = document.getElementById('file');
    document.getElementById('open').onclick = () => file.click();
    file.onchange = async () => { if (file.files[0]) setText(await file.files[0].text()); file.value = ''; };

    ['dragenter', 'dragover'].forEach(n => editor.addEventListener(n, e => { e.preventDefault(); editor.classList.add('over'); }));
    ['dragleave', 'drop'].forEach(n => editor.addEventListener(n, e => { e.preventDefault(); editor.classList.remove('over'); }));
    editor.addEventListener('drop', async (e) => { const f = e.dataTransfer.files[0]; if (f) setText(await f.text()); });

    document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
      document.body.dataset.tab = b.dataset.tab;
      document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
      if (b.dataset.tab === 'view') push();
    });

    // ════════════════════════════════════════════
    // Insert menus — every feature from AUTHORING_GUIDE.md.
    //   ⟦text⟧  marks the placeholder that is selected after insertion
    //           (or replaced by whatever you had selected).
    //   block   puts the snippet in its own paragraph.
    //   top     goes at the very start of the file (meta header).
    // ════════════════════════════════════════════
    const META_BASIC = '::meta\nleft-orb: ⟦📖 Collection 123⟧\nright-orb: 🟢 Ṣaḥīḥ\n::\n\n';
    const META_FULL = '::meta\nnarrator: ⟦Companion (raḍiyallāhu ʿanhu)⟧\ncollection: Canonical Collection\nbook: Book 1 · Title\nhadith: 000\ngrade: sahih\nleft-orb: 📖 Collection 000\nright-orb: 🟢✦✦✦ Ṣaḥīḥ\nverify: https://sunnah.com/\n::\n\n';
    const META_CUSTOM = '::meta\nleft-orb: 📖 ⟦Ṣaḥīḥ al-Bukhārī 6306⟧\nleft-orb-color: #F5E9DC\nleft-orb-text: #3A2E2B\nright-orb: 🟢✦✦✦✦✦ Mutawātir (mass-transmitted)\nright-orb-color: #1B5E20\nright-orb-text: #FFFBF1\nright-orb-compact: 🟢✦✦✦✦✦\n::\n\n';
    const SKELETON = '::meta\nnarrator: Narrator (raḍiyallāhu ʿanhu)\ncollection: Collection\nbook: Book 1 · Title\nhadith: 000\ngrade: sahih\nleft-orb: 📖 Collection 000\nright-orb: 🟢 Ṣaḥīḥ\n::\n\n# ⟦Operational Title⟧\n\n## 📜 The Hadith\n\nNarrator ؓ reported: **The Messenger of Allah ﷺ said:**\n\n> *"Translation of the duʿā."*\n\n<details>\n<summary>📚 Original Arabic Source</summary>\n\n[[ عَنْ | from | ʿan ]]\n\n</details>\n\n## 🔤 Evoke This — Word by Word\n\n[[ اَللَّهُمَّ | O Allah | Allāhumma ]]\n\n*🔗 Verify on sunnah.com — [Citation](https://sunnah.com/)*\n';

    const MENUS = [
      { label: '🪪 Meta', items: [
        { sect: 'Header card (top of file)' },
        { name: 'Basic header', hint: 'left-orb + right-orb pills', top: true, text: META_BASIC },
        { name: 'Full schema', hint: 'narrator, collection, book, hadith, grade, verify…', top: true, text: META_FULL },
        { name: 'Custom colours', hint: 'orb colour, text colour and compact overrides', top: true, text: META_CUSTOM },
        { sect: 'Right-orb grade (auto-coloured)' },
        { name: '🟢 Ṣaḥīḥ', hint: 'green', text: 'right-orb: 🟢 Ṣaḥīḥ' },
        { name: '🔵 Ḥasan', hint: 'blue', text: 'right-orb: 🔵 Ḥasan' },
        { name: '🟠 Ḍaʿīf', hint: 'amber', text: 'right-orb: 🟠 Ḍaʿīf' },
        { name: '🔴 Mawḍūʿ', hint: 'crimson', text: 'right-orb: 🔴 Mawḍūʿ' },
        { name: '🟢 Mutawātir', hint: 'deep green', text: 'right-orb: 🟢✦✦✦✦✦ Mutawātir' },
        { name: '⚪ Other label', hint: 'neutral cream', text: 'right-orb: ⟦Label⟧' },
      ]},
      { label: '🔤 Word stack', items: [

      { label: 'ﷺ Characters', chars: ['ﷺ','ؓ','ā','ī','ū','Ā','Ī','Ū','ḥ','ṣ','ṭ','ḍ','ẓ','Ḥ','Ṣ','Ṭ','Ḍ','Ẓ','ʿ','ʾ','ġ','ḫ','ṯ','ḏ','۞','✦','—','…','📜','🔤','📚','🔗','⚖️','🪶'] },
    ];

    const bar = document.getElementById('menubar');
    const panel = document.getElementById('menu-panel');
    let openIdx = -1;

    bar.innerHTML = '<span class="lead">Insert</span>';
    MENUS.forEach((m, i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'mbtn'; b.textContent = m.label;
      b.addEventListener('mousedown', e => e.preventDefault());   // keep the editor selection
      b.addEventListener('click', () => toggleMenu(i, b));
      bar.appendChild(b);
    });
    const guide = document.createElement('a');
    guide.className = 'mbtn'; guide.textContent = '📖 Guide'; guide.target = '_blank'; guide.rel = 'noopener';
    guide.href = 'render.html?file=AUTHORING_GUIDE.md';
    bar.appendChild(guide);

    function closeMenu() {
      panel.classList.remove('open'); openIdx = -1;
      bar.querySelectorAll('.mbtn.on').forEach(x => x.classList.remove('on'));
    }
    function toggleMenu(i, btn) {
      if (openIdx === i) { closeMenu(); return; }
      closeMenu(); openIdx = i; btn.classList.add('on');
      const m = MENUS[i];
      panel.innerHTML = '';
      if (m.chars) {
        const grid = document.createElement('div'); grid.className = 'chars';
        m.chars.forEach(c => {
          const x = document.createElement('button'); x.type = 'button'; x.textContent = c;
          x.addEventListener('mousedown', e => e.preventDefault());
          x.addEventListener('click', () => insertSnippet({ text: c }));   // stays open for repeated taps
          grid.appendChild(x);
        });
        panel.appendChild(grid);
      } else {
        m.items.forEach(it => {
          if (it.sect) { const h = document.createElement('div'); h.className = 'sect'; h.textContent = it.sect; panel.appendChild(h); return; }
          const x = document.createElement('button'); x.type = 'button'; x.className = 'item';
          x.innerHTML = '<b></b>' + (it.hint ? '<small></small>' : '');
          x.querySelector('b').textContent = it.name;
          if (it.hint) x.querySelector('small').textContent = it.hint;
          x.addEventListener('mousedown', e => e.preventDefault());
          x.addEventListener('click', () => { insertSnippet(it); closeMenu(); });
          panel.appendChild(x);
        });
      }
      const r = btn.getBoundingClientRect();
      panel.style.top = (r.bottom + 4) + 'px';
      panel.style.maxHeight = (window.innerHeight - r.bottom - 16) + 'px';
      panel.classList.add('open');
      panel.style.left = Math.max(8, Math.min(r.left, window.innerWidth - panel.offsetWidth - 8)) + 'px';
    }
    document.addEventListener('mousedown', e => { if (!panel.contains(e.target) && !bar.contains(e.target)) closeMenu(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(); });
    bar.addEventListener('scroll', closeMenu);
    window.addEventListener('resize', closeMenu);

    function insertSnippet(it) {
      // On narrow screens the editor is hidden behind the Card tab.
      if (document.body.dataset.tab !== 'edit') document.querySelector('.tabs button[data-tab="edit"]').click();
      editor.focus();

      if (it.top) {
        const existing = editor.value.search(/^::meta\s*$/m);
        if (existing !== -1) {            // a card has one header: jump to it instead of adding a second
          const end = editor.value.indexOf('\n::', existing);
          editor.setSelectionRange(existing, end === -1 ? existing : end + 3);
          return;
        }
        editor.setSelectionRange(0, 0);
      }

      const start = editor.selectionStart, end = editor.selectionEnd;
      const picked = editor.value.slice(start, end);
      let text = it.text, selOff = -1, selLen = 0;

      const first = text.match(/⟦([^⟧]*)⟧/);
      if (first) {
        selOff = first.index;
        selLen = (picked || first[1]).length;
        text = text.replace(first[0], () => picked || first[1]);
      }
      text = text.replace(/⟦([^⟧]*)⟧/g, '$1');

      if (it.block && !it.top) {
        const before = editor.value.slice(0, start), after = editor.value.slice(end);
        const pre = !before ? '' : before.endsWith('\n\n') ? '' : before.endsWith('\n') ? '\n' : '\n\n';
        const post = !after ? '\n' : after.startsWith('\n\n') ? '' : after.startsWith('\n') ? '\n' : '\n\n';
        text = pre + text + post;
        if (selOff >= 0) selOff += pre.length;
      }

      if (!document.execCommand('insertText', false, text)) {   // execCommand keeps undo history
        editor.setRangeText(text, start, end, 'end');
        editor.dispatchEvent(new Event('input'));
      }
      if (selOff >= 0) editor.setSelectionRange(start + selOff, start + selOff + selLen);
      syncCaret();
    }

    const saved = store.get();
    editor.value = saved !== null ? saved : sampleMd();
    push();
  </script>
