  <style>
    :root {
      --bg-cream: #FFFBF1; --structural: #7D5243; --divider-sand: #E6DCD0;
      --text-espresso: #3A2E2B; --text-taupe: #7A6F6C; --accent-ochre: #B08A4B;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg-cream); color: var(--text-espresso);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      display: flex; flex-direction: column; overflow: hidden;
    }

    header {
      flex: none; display: flex; align-items: center; gap: .6rem; flex-wrap: wrap;
      padding: .55rem .9rem; color: #FFFBF1;
      background: linear-gradient(100deg, rgba(125,82,67,.95), rgba(150,101,79,.95) 65%, rgba(176,138,75,.95));
      box-shadow: 0 2px 10px rgba(125,82,67,.3);
    }
    header a.back { color: #FFFBF1; text-decoration: none; font-size: 1rem; padding: .2rem .55rem;
      border-radius: 999px; background: rgba(255,251,241,.18); }
    header h1 { margin: 0; font-family: 'JetBrains Mono', monospace; font-size: .72rem; font-weight: 700;
      letter-spacing: .1em; text-transform: uppercase; }
    header .sub { font-size: .65rem; opacity: .85; }
    header .spacer { flex: 1; }

    .btn {
      font-family: 'JetBrains Mono', monospace; font-size: .62rem; font-weight: 700;
      letter-spacing: .08em; text-transform: uppercase; cursor: pointer;
      padding: .4rem .75rem; border-radius: 999px;
      border: 1px solid rgba(255,251,241,.45); background: rgba(255,251,241,.15); color: #FFFBF1;
    }
    .btn:hover { background: rgba(255,251,241,.28); }

    main { flex: 1; min-height: 0; display: flex; }
    .pane { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; }
    .pane + .pane { border-left: 1px solid var(--divider-sand); }
    .pane-head {
      flex: none; display: flex; justify-content: space-between; align-items: baseline;
      padding: .4rem .9rem; border-bottom: 1px solid var(--divider-sand);
      font-family: 'JetBrains Mono', monospace; font-size: .6rem; font-weight: 700;
      letter-spacing: .1em; text-transform: uppercase; color: var(--structural);
    }
    .pane-head .note { font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--text-taupe); }

    textarea {
      flex: 1; width: 100%; resize: none; border: 0; outline: 0; padding: .9rem 1rem;
      background: rgba(255,251,241,.6); color: var(--text-espresso);
      font-family: 'JetBrains Mono', ui-monospace, Consolas, monospace;
      font-size: .78rem; line-height: 1.6; tab-size: 2;
    }
    textarea.over { background: rgba(176,138,75,.12); }
    iframe { flex: 1; width: 100%; border: 0; background: var(--bg-cream); }

    .tabs { display: none; }
    @media (max-width: 760px) {
      .tabs { flex: none; display: flex; border-bottom: 1px solid var(--divider-sand); }
      .tabs button {
        flex: 1; padding: .55rem; border: 0; background: transparent; cursor: pointer;
        font-family: 'JetBrains Mono', monospace; font-size: .65rem; font-weight: 700;
        letter-spacing: .1em; text-transform: uppercase; color: var(--text-taupe);
        border-bottom: 2px solid transparent;
      }
      .tabs button.on { color: var(--structural); border-bottom-color: var(--accent-ochre); }
      .pane { display: none; }
      body[data-tab="edit"] .pane.edit, body[data-tab="view"] .pane.view { display: flex; }
      .pane + .pane { border-left: 0; }
      .pane-head, header .sub { display: none; }
    }
    /* ── Insert menu bar ── */
    .menubar {
      flex: none; display: flex; align-items: center; gap: .35rem; padding: .35rem .9rem;
      overflow-x: auto; white-space: nowrap; scrollbar-width: none;
      background: rgba(255,251,241,.96); border-bottom: 1px solid var(--divider-sand);
    }
    .menubar::-webkit-scrollbar { display: none; }
    .menubar .lead { font-family: 'JetBrains Mono', monospace; font-size: .58rem; font-weight: 700;
      letter-spacing: .1em; text-transform: uppercase; color: var(--text-taupe); margin-right: .2rem; }
    .mbtn {
      font-family: 'JetBrains Mono', monospace; font-size: .64rem; font-weight: 700;
      letter-spacing: .06em; text-transform: uppercase; cursor: pointer; flex: none;
      padding: .35rem .7rem; border-radius: 999px; text-decoration: none;
      border: 1px solid var(--divider-sand); background: #fff; color: var(--structural);
    }
    .mbtn:hover, .mbtn.on { background: rgba(176,138,75,.18); border-color: rgba(176,138,75,.55); }
    .menu-panel {
      position: fixed; z-index: 50; width: 340px; max-width: calc(100vw - 16px); overflow-y: auto;
      background: rgba(255,251,241,.99); border: 1px solid var(--divider-sand); border-radius: 12px;
      box-shadow: 0 10px 30px rgba(125,82,67,.25); padding: .35rem; display: none;
    }
    .menu-panel.open { display: block; }
    .menu-panel .sect { font-family: 'JetBrains Mono', monospace; font-size: .56rem; font-weight: 700;
      letter-spacing: .1em; text-transform: uppercase; color: var(--accent-ochre); padding: .5rem .55rem .15rem; }
    .menu-panel .item { display: block; width: 100%; text-align: left; border: 0; background: transparent;
      cursor: pointer; padding: .4rem .55rem; border-radius: 8px; color: var(--text-espresso); font-family: inherit; }
    .menu-panel .item:hover { background: rgba(176,138,75,.16); }
    .menu-panel .item b { display: block; font-size: .78rem; font-weight: 600; }
    .menu-panel .item small { display: block; font-size: .68rem; color: var(--text-taupe); line-height: 1.35; margin-top: .1rem; }
    .menu-panel .chars { display: grid; grid-template-columns: repeat(auto-fill, minmax(2.4rem, 1fr)); gap: .3rem; padding: .3rem .4rem .5rem; }
    .menu-panel .chars button { border: 1px solid var(--divider-sand); background: #fff; border-radius: 8px;

    .menu-panel .chars button:hover { background: rgba(176,138,75,.18); }

    .kbd-dock {

      background: rgba(255,251,241,.98); border-top: 1px solid var(--divider-sand);

    .kbd-dock[hidden] { display: none; }
    .kbd-bar { display: flex; align-items: center; gap: .35rem; flex-wrap: wrap; margin-bottom: .4rem; }
    .kbd-bar .spacer { flex: 1; }
    .kbd-tab, .kbd-tog {
      font-family: 'JetBrains Mono', monospace; font-size: .6rem; font-weight: 700;
      letter-spacing: .06em; text-transform: uppercase; cursor: pointer;

    .kbd-tog.on { background: var(--structural); border-color: var(--structural); color: #FFFBF1; }
    .kbd-sec { margin: .45rem 0 .2rem; font-family: 'JetBrains Mono', monospace; font-size: .55rem; font-weight: 700;
      letter-spacing: .1em; text-transform: uppercase; color: var(--accent-ochre); }
    .kbd-row { display: flex; flex-wrap: wrap; gap: .25rem; justify-content: center; margin-bottom: .25rem; }
    .kbd-row.start { justify-content: flex-start; }
    .k {

# 7 x Hasbiyallah — Allah will suffice them in whatever concerns them of the matters of this world and the Hereafter

Recite what Allah told the one most concerned for us **7 x** during the morning (after Fajr) and during the evening (after ʿAsr or Maghrib):
> *"Allah is sufficient for me. There is none worthy of worship but Him. I have placed my trust in Him, and He is Lord of the Majestic Throne."*

  <script>
    const KEY = 'som-card-builder-draft';
    const editor = document.getElementById('editor');
    const frame = document.getElementById('frame');
    let ready = false, timer = null;
    let refocusUntil = 0;   // while now < this, a player that steals focus from the editor is sent straight back

    // localStorage can throw (private windows, blocked site data)
    const store = {
      get() { try { return localStorage.getItem(KEY); } catch (e) { return null; } },
      set(v) { try { localStorage.setItem(KEY, v); } catch (e) {} }
    };
    const sampleMd = () => document.getElementById('sample-md').textContent.replace(/^\n/, '').replace(/\s+$/, '\n');

    const caretLine = () => editor.value.slice(0, editor.selectionStart).split('\n').length;
    let lastLine = 0;

    function push() {
      if (document.activeElement === editor) refocusUntil = Date.now() + 5000;   // the author is typing
      document.getElementById('count').textContent = editor.value ? editor.value.split('\n').length + ' lines' : '';
      if (ready) frame.contentWindow.postMessage({ type: 'som-preview', md: editor.value, line: document.activeElement === editor ? caretLine() : 0 }, '*');
    }

    // Tell the preview which line the caret is on so it can highlight it.
    function syncCaret() {
      if (!ready || document.activeElement !== editor) return;
      const n = caretLine();
      if (n === lastLine) return;
      lastLine = n;
      frame.contentWindow.postMessage({ type: 'som-focus', line: n }, '*');
    }
    document.addEventListener('selectionchange', syncCaret);
    let fromPreview = false;
    editor.addEventListener('focus', () => { if (fromPreview) return; lastLine = 0; syncCaret(); });
    function schedule() {
      clearTimeout(timer);
      timer = setTimeout(() => { store.set(editor.value); push(); }, 250);
    }
    function setText(t) { editor.value = t; store.set(t); push(); }

    // Click in the preview → select the matching source line in the editor.
    function gotoLine(n) {
      const lines = editor.value.split('\n');
      n = Math.max(1, Math.min(n, lines.length));
      let start = 0;
      for (let i = 0; i < n - 1; i++) start += lines[i].length + 1;
      if (getComputedStyle(editor).display === 'none' || !editor.offsetParent) return;   // narrow screen: editor is on the other tab
      // The preview already highlighted what was clicked; don't let the editor's
      // focus event echo the *old* caret line back and move the highlight/scroll.
      fromPreview = true;
      editor.focus({ preventScroll: true });
      editor.setSelectionRange(start, start + lines[n - 1].length);
      lastLine = n;
      editor.scrollTop = Math.max(0, offsetOfLine(start) - editor.clientHeight / 2);
      setTimeout(() => { fromPreview = false; }, 0);
    }

    // Pixel offset of a character index, accounting for soft-wrapped lines
    // (long duas wrap, so n × line-height would drift).
    function offsetOfLine(idx) {
      const cs = getComputedStyle(editor);
      const m = document.createElement('div');
      m.style.cssText = 'position:absolute;visibility:hidden;white-space:pre-wrap;overflow-wrap:break-word;top:0;left:-9999px;';
      ['fontFamily', 'fontSize', 'lineHeight', 'letterSpacing', 'tabSize', 'paddingLeft', 'paddingRight', 'borderLeftWidth', 'borderRightWidth']
        .forEach(p => { m.style[p] = cs[p]; });
      m.style.width = editor.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) + 'px';
      m.style.paddingLeft = m.style.paddingRight = '0';
      m.textContent = editor.value.slice(0, idx) + '​';
      document.body.appendChild(m);
      const h = m.offsetHeight - (parseFloat(cs.lineHeight) || 0);
      m.remove();
      return h + parseFloat(cs.paddingTop);
    }

    window.addEventListener('message', (e) => {
      if (e.source !== frame.contentWindow || !e.data) return;
      if (e.data.type === 'som-preview-ready') { ready = true; push(); }

      // On narrow screens the editor is hidden behind the Card tab.
      if (document.body.dataset.tab !== 'edit') document.querySelector('.tabs button[data-tab="edit"]').click();

      if (it.top) {

      const start = editor.selectionStart, end = editor.selectionEnd;

      const first = text.match(/⟦([^⟧]*)⟧/);

        selLen = (picked || first[1]).length;

      text = text.replace(/⟦([^⟧]*)⟧/g, '$1');

      if (it.block && !it.top) {
        const before = editor.value.slice(0, start), after = editor.value.slice(end);

        M('0613', 'raḍiyallāhu ʿanhu'), M('0612', 'raḥimahullāh'), M('0611', 'ʿalayhi as-salām'),
        M('0610', 'ṣallallāhu ʿalayhi wa-sallam (small sign)')]],
      ['Joining', [[cp('200D'), 'zero-width joiner', 'ZWJ'], [cp('200C'), 'zero-width non-joiner', 'ZWNJ']]],
    ];

    // Arabic 101 layout by physical key. Second entry = with Shift (null = leave the key alone).
    const KB_PHYS = {
      Backquote: ['ذ', cp('0651')], KeyQ: ['ض', cp('064E')], KeyW: ['ص', cp('064B')], KeyE: ['ث', cp('064F')],
      KeyR: ['ق', cp('064C')], KeyT: ['ف', cp('0644') + cp('0625')], KeyY: ['غ', cp('0625')], KeyU: ['ع', null],
      KeyI: ['ه', null], KeyO: ['خ', null], KeyP: ['ح', cp('061B')], BracketLeft: ['ج', null], BracketRight: ['د', null],
      KeyA: ['ش', cp('0650')], KeyS: ['س', cp('064D')], KeyD: ['ي', null], KeyF: ['ب', null],
      KeyG: ['ل', cp('0644') + cp('0623')], KeyH: ['ا', cp('0623')], KeyJ: ['ت', cp('0640')], KeyK: ['ن', cp('060C')],
      KeyL: ['م', null], Semicolon: ['ك', null], Quote: ['ط', null],
      KeyZ: ['ئ', null], KeyX: ['ء', cp('0652')], KeyC: ['ؤ', null], KeyV: ['ر', null],
      KeyB: [cp('0644') + cp('0627'), cp('0644') + cp('0622')], KeyN: ['ى', cp('0622')], KeyM: ['ة', null],
      Comma: ['و', null], Period: ['ز', null], Slash: ['ظ', cp('061F')],
    };

    function kbType(text) {
      if (text === '\b') { editor.focus(); document.execCommand('delete'); schedule(); return; }
      insertSnippet({ text });   // same path as the Characters menu: keeps undo, caret and preview in step
    }

    function kbKey(c, title, label, extra) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'k' + (extra ? ' ' + extra : '');
      const isMark = /^\p{Mn}$/u.test(c);
      if (isMark && !label) b.classList.add('mark');
      b.textContent = label || (isMark ? cp('0640') + c : c);   // marks sit on a taṭwīl so they stay visible
      if (label) b.classList.add('txt');
      if (title) { b.title = title; b.setAttribute('aria-label', title); }
      b.addEventListener('mousedown', e => e.preventDefault());   // keep the editor's selection and focus
      b.addEventListener('click', () => kbType(c));
      return b;
    }

    function kbRow(keys, cls) {
      const r = document.createElement('div');
      r.className = 'kbd-row' + (cls ? ' ' + cls : '');
      keys.forEach(k => r.appendChild(kbKey(k[0], k[1], k[2])));
      return r;
    }

    function kbRender() {
      dock.innerHTML = '';
      const bar = document.createElement('div');
      bar.className = 'kbd-bar';
      [['letters', 'حروف · Letters'], ['marks', 'تجويد · Tajweed & marks']].forEach(([id, label]) => {
        const t = document.createElement('button');
        t.type = 'button'; t.className = 'kbd-tab' + ((kb.page || 'letters') === id ? ' on' : ''); t.textContent = label;
        t.addEventListener('mousedown', e => e.preventDefault());
        t.addEventListener('click', () => { kb.page = id; kbSave(); kbRender(); });
        bar.appendChild(t);
      });
      const sp = document.createElement('span'); sp.className = 'spacer'; bar.appendChild(sp);
      const phys = document.createElement('button');
      phys.type = 'button'; phys.className = 'kbd-tog' + (kb.phys ? ' on' : ''); phys.id = 'kbd-phys';
      phys.textContent = kb.phys ? 'ع Typing Arabic' : 'A Typing Latin';
      phys.title = 'Make your own keyboard type Arabic (standard Arabic 101 layout; Shift gives the tashkeel). Ctrl+Space switches.';
      phys.addEventListener('mousedown', e => e.preventDefault());
      phys.addEventListener('click', kbTogglePhys);
      bar.appendChild(phys);
      const x = document.createElement('button');
      x.type = 'button'; x.className = 'kbd-tab'; x.textContent = '✕'; x.title = 'Close the keyboard';
      x.addEventListener('mousedown', e => e.preventDefault());
      x.addEventListener('click', () => kbShow(false));
      bar.appendChild(x);
      dock.appendChild(bar);

      if ((kb.page || 'letters') === 'letters') {
        KB_LETTERS.forEach(r => dock.appendChild(kbRow(r)));
        const bottom = document.createElement('div');
        bottom.className = 'kbd-row';
        const stack = kbKey('[[ ⟦ ⟧ | | ]]', 'Start a word-stack [[ | | ]] — type the Arabic, then the English and the transliteration', 'STACK', 'wide');
        const space = kbKey(' ', 'space', 'SPACE', 'space');
        const back = kbKey('\b', 'backspace', '⌫', 'wide');
        bottom.appendChild(stack);
        KB_PUNCT.forEach(k => bottom.appendChild(kbKey(k[0], k[1])));
        bottom.appendChild(space); bottom.appendChild(back);
        dock.appendChild(bottom);
      } else {
        KB_MARKS.forEach(([title, keys]) => {
          const h = document.createElement('div'); h.className = 'kbd-sec'; h.textContent = title; dock.appendChild(h);
          dock.appendChild(kbRow(keys, 'start'));
        });
        const n = document.createElement('div');
        n.className = 'kbd-note';
        n.textContent = 'Type the letter first, then the mark: it attaches to the letter before it. Hover a key for its name; roles are stated only where they are certain.';
        dock.appendChild(n);
      }
    }

    function kbShow(open) {
      kb.open = !!open; kbSave();
      dock.hidden = !open;
      if (open) kbRender();
      const btn = document.getElementById('kbd-open');
      if (btn) btn.classList.toggle('on', !!open);
    }

    function kbTogglePhys() {
      kb.phys = !kb.phys; kbSave();
      editor.classList.toggle('arabic-on', !!kb.phys);
      const p = document.getElementById('kbd-phys');
      if (p) { p.classList.toggle('on', !!kb.phys); p.textContent = kb.phys ? 'ع Typing Arabic' : 'A Typing Latin'; }
    }

    // Your own keyboard, mapped to Arabic 101 while the switch is on (Ctrl/Alt/Meta shortcuts are left alone).
    editor.addEventListener('keydown', (e) => {
      if (!kb.phys || e.isComposing || e.ctrlKey || e.altKey || e.metaKey) return;
      const m = KB_PHYS[e.code];
      if (!m) return;
      const ch = e.shiftKey ? m[1] : m[0];
      if (!ch) return;
      e.preventDefault();
      kbType(ch);
    });
    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey && !e.altKey && !e.metaKey && e.code === 'Space') { e.preventDefault(); kbTogglePhys(); }
    });

    const kbBtn = document.createElement('button');
    kbBtn.type = 'button'; kbBtn.className = 'mbtn'; kbBtn.id = 'kbd-open'; kbBtn.textContent = '⌨ Arabic';
    kbBtn.title = 'Arabic keyboard with tashkeel and tajweed marks';
    kbBtn.addEventListener('mousedown', e => e.preventDefault());
    kbBtn.addEventListener('click', () => kbShow(dock.hidden));
    bar.insertBefore(kbBtn, guide);
    editor.classList.toggle('arabic-on', !!kb.phys);
    kbShow(!!kb.open);

    // ════════════════════════════════════════════
    // Follow-along video — the pinnable YouTube card.
    // The look and the 📌 pin button live in render.html; this builds the markup from a pasted link.
    // ════════════════════════════════════════════
    function ytSeconds(v) {
      if (v == null) return null;
      v = String(v).trim();
      if (!v) return null;
      if (/^\d+$/.test(v)) return +v;
      if (v.indexOf(':') !== -1) return v.split(':').reduce((a, p) => a * 60 + (+p || 0), 0);
      const m = v.match(/^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?$/i);   // 1m12s, 72s, 1h2m3s
      if (!m || !(m[1] || m[2] || m[3])) return null;
      return (+m[1] || 0) * 3600 + (+m[2] || 0) * 60 + (+m[3] || 0);
    }

    function ytClock(sec) {
      return sec == null ? '' : Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
    }

    // Accepts watch?v=…, youtu.be/…, /embed/…, /shorts/…, /live/…, or a bare 11-character id.
    // A time in the link (t= or start=) becomes the start; end= becomes the end.
    function ytParse(input) {
      const s = (input || '').trim();
      if (!s) return null;
      let id = null, params = new URLSearchParams();
      if (/^[\w-]{11}$/.test(s)) {
        id = s;
      } else {
        let u;
        try { u = new URL(/^https?:\/\//i.test(s) ? s : 'https://' + s); } catch (e) { return null; }
        const host = u.hostname.replace(/^(www|m)\./, '');
        params = u.searchParams;
        if (host === 'youtu.be') id = u.pathname.split('/')[1];
        else if (/(^|\.)youtube(-nocookie)?\.com$/.test(host)) {
          const fromPath = u.pathname.match(/^\/(?:embed|shorts|live|v)\/([\w-]{11})/);
          id = params.get('v') || (fromPath ? fromPath[1] : null);
        }
      }
      if (!id || !/^[\w-]{11}$/.test(id)) return null;
      const startRaw = params.get('start') != null ? params.get('start') : params.get('t');
      return { id, start: ytSeconds(startRaw), end: ytSeconds(params.get('end')) };
    }

    function followAlongSnippet(id, start, end) {
      const q = [];
      if (start != null && start > 0) q.push('start=' + start);
      if (end != null && end > (start || 0)) q.push('end=' + end);
      const src = 'https://www.youtube.com/embed/' + id + (q.length ? '?' + q.join('&amp;') : '');
      return '📺 **Listen and follow along** — tap 📌 on the video to pin it while you read below.\n\n' +
        '<div class="video-card">\n' +
        '<iframe src="' + src + '" title="YouTube video player" frameborder="0" ' +
        'allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" ' +
        'referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>\n' +
        '<button class="video-pin-toggle" title="Pin video so it stays visible while you scroll">📌 Follow along</button>\n' +
        '</div>';
    }

    function insertFollowAlong() {
      const link = window.prompt('YouTube link (watch, youtu.be or embed).\nA time in the link, such as ?t=72, becomes the start.\nLeave blank for an empty template.', '');
      if (link === null) return;
      if (!link.trim()) { insertSnippet({ text: followAlongSnippet('⟦VIDEO_ID⟧', null, null), block: true }); return; }
      const y = ytParse(link);
      if (!y) { alert('That does not look like a YouTube link or a video id.'); return; }
      const dflt = (y.start != null || y.end != null) ? ytClock(y.start != null ? y.start : 0) + ' - ' + ytClock(y.end) : '';
      const range = window.prompt('Play from – to, in seconds or m:ss, for example 1:12 - 2:15.\nLeave blank to play the whole video.', dflt);
      let start = y.start, end = y.end;
      if (range !== null) {   // cancelling keeps whatever the link had
        const p = range.split(/\s*[-–—]\s*/);
        start = ytSeconds(p[0]);
        end = p.length > 1 ? ytSeconds(p[1]) : null;
      }
      insertSnippet({ text: followAlongSnippet(y.id, start, end), block: true });
    }

    // A player that loads in the preview (QuranWBW, YouTube) takes keyboard focus; hand it back while typing.
    editor.addEventListener('blur', (e) => {
      if (Date.now() < refocusUntil && e.relatedTarget === frame) setTimeout(() => editor.focus({ preventScroll: true }), 0);
    });
    setInterval(() => {
      if (Date.now() < refocusUntil && document.activeElement === frame) editor.focus({ preventScroll: true });
    }, 150);

    const saved = store.get();
    editor.value = saved !== null ? saved : sampleMd();
    push();
  </script>
</body>
</html>
