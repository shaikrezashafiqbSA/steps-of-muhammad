  <script>
    // ════════════════════════════════════════════
    // Reading Mode Fan v5.1
    // 🔧 TUNE HERE: change labels or order below — `label` is the
    // readable text shown on the fan pills; `rumi` marks the modes that
    // show transliteration (what the HUD's Rumi slot toggles)
    // ════════════════════════════════════════════
    const READING_MODES = [
      { key: 'arabic-first', label: 'Arabic and meaning',       rumi: false },
      { key: 'learner',      label: 'Arabic, Rumi and meaning', rumi: true  },
      { key: 'verbal',       label: 'Rumi first',               rumi: true  },
      { key: 'arabic-only',  label: 'Arabic only',              rumi: false }
    ];
    const RUMI_OFF_MODE = 'arabic-first';
    const RUMI_ON_MODE  = 'learner';

    const MODE_KEY = 'tahlil-reading-mode';
    const DEFAULT_MODE = 'arabic-first';

    function getCurrentMode() {
      const saved = localStorage.getItem(MODE_KEY);
      const valid = READING_MODES.some(m => m.key === saved);
      return valid ? saved : DEFAULT_MODE;
    }

    function getModeConfig(key) {
      return READING_MODES.find(m => m.key === key) || READING_MODES[0];
    }

    function applyMode(key) {
      const cfg = getModeConfig(key);
      document.body.setAttribute('data-mode', cfg.key);
      localStorage.setItem(MODE_KEY, cfg.key);

      const trigger = document.getElementById('modeFanTrigger');
      if (trigger) {
        trigger.classList.toggle('is-on', cfg.rumi);
        trigger.setAttribute('aria-pressed', cfg.rumi);
      }

      document.querySelectorAll('.mode-fan-item').forEach(b => {
        b.classList.toggle('active', b.dataset.modeKey === cfg.key);
      });
    }

    function openFan() {
      const fan = document.getElementById('modeFan');
      const trigger = document.getElementById('modeFanTrigger');
      if (fan) fan.classList.add('fan-open');
      if (trigger) trigger.classList.add('fan-open');
    }

    function closeFan() {
      const fan = document.getElementById('modeFan');
      const trigger = document.getElementById('modeFanTrigger');
      if (fan) fan.classList.remove('fan-open');
      if (trigger) trigger.classList.remove('fan-open');
    }

    function buildModeFan() {
      const container = document.getElementById('modeFanItems');
      const trigger   = document.getElementById('modeFanTrigger');
      if (!container || !trigger) return;

      container.innerHTML = '';
      READING_MODES.forEach(m => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'mode-fan-item';
        btn.dataset.modeKey = m.key;
        btn.title = m.label;
        btn.textContent = m.label;
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          applyMode(m.key);
          closeFan();
        });
        container.appendChild(btn);
      });

      // Tap flips Rumi on/off; hold (touch) or right-click (mouse) opens the
      // fan for the other reading modes.
      let holdTimer = null, held = false;
      trigger.addEventListener('pointerdown', () => {
        held = false;
        clearTimeout(holdTimer);
        holdTimer = setTimeout(() => { held = true; openFan(); }, 450);
      });
      ['pointerup', 'pointerleave', 'pointercancel'].forEach(t =>
        trigger.addEventListener(t, () => clearTimeout(holdTimer)));
      trigger.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        openFan();
      });
      trigger.onclick = (e) => {
        e.stopPropagation();
        if (held) { held = false; return; }
        closeFan();
        applyMode(getModeConfig(getCurrentMode()).rumi ? RUMI_OFF_MODE : RUMI_ON_MODE);
      };

      document.addEventListener('click', (e) => {
        const fan = document.getElementById('modeFan');
        if (fan && fan.classList.contains('fan-open') && !fan.contains(e.target)) {
          closeFan();
        }
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeFan();
      });
    }

    buildModeFan();
    applyMode(getCurrentMode());

    // ════════════════════════════════════════════
    // Follow-along video — pin/unpin toggle
    // Off by default on every load; reader opts in.
    // ════════════════════════════════════════════
    document.addEventListener('click', (e) => {
      const btn = e.target.closest('.video-pin-toggle');
      if (!btn) return;
      const card = btn.closest('.video-card');
      if (!card) return;
      const pinned = card.classList.toggle('pinned');
      btn.textContent = pinned ? '📌 Pinned' : '📌 Follow along';
    });

    // ════════════════════════════════════════════
    // Zoom engine v4.2
    // ════════════════════════════════════════════
    const ZOOM_KEY = 'tahlil-zoom-level';
    const ZOOM_MIN = 1, ZOOM_MAX = 5, ZOOM_DEFAULT = 3;

    function getCurrentZoom() {
      const raw = parseInt(localStorage.getItem(ZOOM_KEY), 10);
      if (isNaN(raw) || raw < ZOOM_MIN || raw > ZOOM_MAX) return ZOOM_DEFAULT;
      return raw;
    }

    function applyZoom(level) {
      const clamped = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, level));
      document.body.setAttribute('data-zoom', clamped);
      localStorage.setItem(ZOOM_KEY, clamped);

      const fOut = document.getElementById('floatZoomOut');
      const fIn  = document.getElementById('floatZoomIn');
      if (fOut) fOut.disabled = (clamped <= ZOOM_MIN);
      if (fIn)  fIn.disabled  = (clamped >= ZOOM_MAX);
    }

    applyZoom(getCurrentZoom());

    document.getElementById('floatZoomOut')?.addEventListener('click', () => {
      applyZoom(getCurrentZoom() - 1);
    });
    document.getElementById('floatZoomIn')?.addEventListener('click', () => {
      applyZoom(getCurrentZoom() + 1);
    });

    document.addEventListener('keydown', (e) => {
      if (!(e.ctrlKey || e.metaKey)) return;
      if (e.key === '-' || e.key === '_') {
        e.preventDefault();
        applyZoom(getCurrentZoom() - 1);
      } else if (e.key === '=' || e.key === '+') {
        e.preventDefault();
        applyZoom(getCurrentZoom() + 1);
      } else if (e.key === '0') {
        e.preventDefault();
        applyZoom(ZOOM_DEFAULT);
      }
    });

    // ════════════════════════════════════════════
    // HUD title strip: tucks away while reading downward to give the
    // text more room; returns on any scroll up and at the end of the card.
    // ════════════════════════════════════════════
    (function () {
      const strip = document.getElementById('somHudNav');
      if (!strip) return;
      let lastY = window.scrollY;
      window.addEventListener('scroll', () => {
        const y = window.scrollY;
        const atEnd = window.innerHeight + y >= document.documentElement.scrollHeight - 80;
        if (atEnd || y < lastY - 6) strip.classList.remove('is-tucked');
        else if (y > lastY + 6 && y > 160) strip.classList.add('is-tucked');
        lastY = y;
      }, { passive: true });
    })();

    // ════════════════════════════════════════════
    // Slugify helper (used by TOC)
    // ════════════════════════════════════════════
    function slugify(text) {
      return text.toLowerCase()
        .replace(/[^\w\s-]/g, '')
        .replace(/\s+/g, '-')
        .replace(/-+/g, '-')
        .trim();
    }

    // ════════════════════════════════════════════
    // Meta-block parser
    // ════════════════════════════════════════════
    function parseMetaBlock(mdSource) {
      const metaRe = /^::meta\s*\n([\s\S]*?)\n::\s*\n?/m;
      const match = mdSource.match(metaRe);
      if (!match) return { meta: null, stripped: mdSource };

      const lines = match[1].split('\n');
      const meta = {};
      lines.forEach(line => {
        const idx = line.indexOf(':');
        if (idx === -1) return;
        const key = line.slice(0, idx).trim().toLowerCase();
        const val = line.slice(idx + 1).trim();
        if (key) meta[key] = val;
      });

      const stripped = mdSource.replace(metaRe, '');
      return { meta, stripped };
    }

    // ════════════════════════════════════════════
    // Orb rendering v4.4
    //   Two orbs, both sticky floating (top corners).
    //   Full text on initial view; compact (leading emoji)
    //   after user scrolls past threshold.
    //
    //   Author-controllable meta fields:
    //     left-orb           → full display text (e.g., "📖 Musnad Aḥmad 3712")
    //     left-orb-compact   → override for compact form (default: leading emoji auto-extracted)
    //     left-orb-color     → background hex override (e.g., "#F5E9DC")
    //     left-orb-text      → text color hex override (e.g., "#3A2E2B")
    //     right-orb          → full display text (e.g., "🟢✦✦✦ Ṣaḥīḥ (Darussalam)")
    //     right-orb-compact  → override for compact form
    //     right-orb-color    → background hex override
    //     right-orb-text     → text color hex override
    // ════════════════════════════════════════════

    // Regex that finds a leading emoji or symbol cluster
    const LEADING_ICON_RE = /^([\p{Extended_Pictographic}\u2600-\u27BF\u2B00-\u2BFF\u2300-\u23FF\uFE0F\u200D]+)\s*/u;

    function extractLeadingIcon(text) {
      if (!text) return '';
      const match = text.match(LEADING_ICON_RE);
      return match ? match[1] : '';
    }

    function buildOrbStyle(bg, text) {
      const parts = [];
      if (bg)   parts.push(`background: ${bg}`);
      if (text) parts.push(`color: ${text}`);
      if (parts.length === 0) return '';
      return `style="${parts.join('; ')};"`;
    }

    function renderMetaCard(meta) {
      if (!meta) return '';

      const leftFull  = meta['left-orb']  || '';
      const rightFull = meta['right-orb'] || (meta.grade ? meta.grade.toUpperCase() : '');

      if (!leftFull && !rightFull) return '';

      // Compact forms — explicit override wins, else auto-extract leading icon
      const leftCompact  = meta['left-orb-compact']  || extractLeadingIcon(leftFull)  || leftFull;
      const rightCompact = meta['right-orb-compact'] || extractLeadingIcon(rightFull) || rightFull;

      // Auto color-code right orb by detecting grade keywords in text
      const rightLower = rightFull.toLowerCase();
      let rightColorClass = 'orb-right-neutral';
      if (rightLower.includes('ṣaḥīḥ') || rightLower.includes('sahih')) rightColorClass = 'orb-right-sahih';
      else if (rightLower.includes('ḥasan') || rightLower.includes('hasan')) rightColorClass = 'orb-right-hasan';
      else if (rightLower.includes('ḍaʿīf') || rightLower.includes('daif')) rightColorClass = 'orb-right-daif';
      else if (rightLower.includes('mawḍūʿ') || rightLower.includes('mawdu')) rightColorClass = 'orb-right-mawdu';
      else if (rightLower.includes('mutawātir') || rightLower.includes('mutawatir')) rightColorClass = 'orb-right-mutawatir';

      // Inline style overrides if author specified colors
      const leftStyle  = buildOrbStyle(meta['left-orb-color'],  meta['left-orb-text']);
      const rightStyle = buildOrbStyle(meta['right-orb-color'], meta['right-orb-text']);

      // Split leading icon from rest of label
      const leftLabel  = leftFull.replace(LEADING_ICON_RE, '');
      const rightLabel = rightFull.replace(LEADING_ICON_RE, '');

      const leftHTML = leftFull
        ? `<span class="orb orb-left" ${leftStyle}><span class="orb-icon">${leftCompact}</span>${leftLabel ? `<span class="orb-label">${leftLabel}</span>` : ''}</span>`
        : '<span></span>';

      const rightHTML = rightFull
        ? `<span class="orb orb-right ${rightColorClass}" ${rightStyle}><span class="orb-icon">${rightCompact}</span>${rightLabel ? `<span class="orb-label">${rightLabel}</span>` : ''}</span>`
        : '';

      return `${leftHTML}${rightHTML}`;
    }

    // ════════════════════════════════════════════
    // Orb scroll watcher — triggers compact mode
    // when user scrolls past threshold
    // ════════════════════════════════════════════
    function initOrbScrollWatcher() {
      const SCROLL_THRESHOLD = 100;

      let ticking = false;
      function onScroll() {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(() => {
          const scrolled = window.scrollY > SCROLL_THRESHOLD;
          document.body.classList.toggle('orbs-compact', scrolled);
          ticking = false;
        });
      }

      window.addEventListener('scroll', onScroll, { passive: true });
      onScroll();
    }

    // ════════════════════════════════════════════
    // Word-stack parser
    //   [[arabic|english|translit]]  →  <span class="w"><b>...</b><i>...</i><u>...</u></span>
    // ════════════════════════════════════════════
    function parseWordStacks(rootEl) {
      const html = rootEl.innerHTML;
      // Preview mode prefixes each stack with its source line number
      // wrapped in word joiners (U+2060) so it can be traced back.
      const wordRe = /(?<!\\)(?:⁠(\d+)⁠)?\[\[([^\[\]|]+)(?:\|([^\[\]|]*))?(?:\|([^\[\]|]*))?(?:\|([^\[\]|]*))?\]\]/g;

      const transformed = html.replace(wordRe, (match, line, ar, en, tr, kal) => {
        const arabic = (ar || '').trim();
        const english = (en || '').trim();
        const translit = (tr || '').trim();
        let inner = `<b>${arabic}</b>`;
        if (english) inner += `<i>${english}</i>`;
        if (translit) inner += `<u>${translit}</u>`;
        // optional 4th field: a glossary slug → tapping the word opens content/kalima/<slug>.md
        const slug = (kal || '').trim().replace(/^@/, '').toLowerCase();
        const kalAttrs = /^[a-z0-9-]+$/.test(slug)
          ? ` data-kalima="${slug}" tabindex="0" role="button" aria-label="${arabic} — open glossary entry"` : '';
        return `<span class="w"${line ? ` data-line="${line}"` : ''}${kalAttrs}>${inner}</span>`;
      })
      .replace(/\\\[\[/g, '[[');

      rootEl.innerHTML = transformed;
      somParseTips(rootEl);   // {{ word | note }} tooltips (web/tips.js)
      groupAyahs(rootEl);
      wrapHikmahSections(rootEl);
    }

    // "## {{ Hikmah | @hikmah }}" plus what follows it (up to the next heading, drawer or rule)
    // goes in one .hikmah-box, so the whole section can carry the gleam.
    function wrapHikmahSections(rootEl) {
      rootEl.querySelectorAll('h2').forEach(h => {
        if (h.parentElement.classList.contains('hikmah-box')) return;
        if (!h.querySelector('.som-tip[data-kalima="hikmah"]')) return;
        const box = document.createElement('div');
        box.className = 'hikmah-box';
        h.parentNode.insertBefore(box, h);
        let n = h;
        while (n && (n === h || !/^(H1|H2|H3|DETAILS|HR)$/.test(n.tagName))) {
          const next = n.nextElementSibling;
          box.appendChild(n);
          n = next;
        }
      });
    }

    function groupAyahs(rootEl) {
      const allW = Array.from(rootEl.querySelectorAll('span.w'));
      let i = 0;
      while (i < allW.length) {
        const first = allW[i];
        if (first.closest('.ayah')) { i++; continue; }

        const group = [first];
        let next = first.nextSibling;
        while (next) {
          if (next.nodeType === Node.TEXT_NODE && next.textContent.trim() === '') {
            next = next.nextSibling;
            continue;
          }
          if (next.nodeType === Node.ELEMENT_NODE && next.classList && next.classList.contains('w')) {
            group.push(next);
            next = next.nextSibling;
            continue;
          }
          break;
        }

        const ayah = document.createElement('div');
        ayah.className = 'ayah';
        first.parentNode.insertBefore(ayah, first);
        group.forEach(node => ayah.appendChild(node));

        i += group.length;
      }

      rootEl.querySelectorAll('p > .ayah').forEach(ayah => {
        const p = ayah.parentNode;
        const onlyChild = Array.from(p.childNodes).every(n =>
          n === ayah || (n.nodeType === Node.TEXT_NODE && n.textContent.trim() === '')
        );
        if (onlyChild) {
          p.parentNode.insertBefore(ayah, p);
          p.remove();
        } else {
          p.parentNode.insertBefore(ayah, p.nextSibling);
        }
      });
    }

    // ════════════════════════════════════════════
    // TOC builder v4.1
    // ════════════════════════════════════════════
    function buildTOC(target) {
      if (window._collectionToc) return buildCollectionTOC(target);
      const tocPanel = document.getElementById('toc');
      const tocList = document.getElementById('tocList');
      const hudTocBtn = document.getElementById('hudTocBtn');
      // Sections are h2/h3 headings plus top-level drawers (the Dalīl, Ḥikmah,
      // Original Arabic …), listed by their <summary> in document order.
      // Embedded cards and drawers nested inside another drawer stay out.
      const headings = Array.from(target.querySelectorAll('h2, h3, details')).filter(el =>
        el.tagName !== 'DETAILS' ||
        (!el.classList.contains('embed-card') && !el.parentElement.closest('details')));

      // The title is not counted: a card with fewer than two sections still gets no TOC.
      if (headings.length < 2) {
        if (tocPanel) tocPanel.style.display = 'none';
        if (hudTocBtn) hudTocBtn.style.display = 'none';
        return;
      }

      tocList.innerHTML = '';

      // First row: the card title (H1), a back-to-top link. Single cards only.
      const titleEl = target.querySelector('h1');
      if (titleEl && !titleEl.closest('details')) {
        const tli = document.createElement('li');
        tli.className = 'toc-title';
        const ta = document.createElement('a');
        ta.href = '#';
        ta.textContent = titleEl.textContent.replace(/\s+/g, ' ').trim();
        ta.addEventListener('click', (e) => {
          e.preventDefault();
          window.scrollTo({ top: 0, behavior: 'smooth' });
          closeTOC();
        });
        tli.appendChild(ta);
        tocList.appendChild(tli);
      }

      headings.forEach((h, i) => {
        const isDrawer = h.tagName === 'DETAILS';
        const label = (isDrawer ? h.querySelector('summary') || h : h).textContent.replace(/\s+/g, ' ').trim();
        if (!h.id) {
          // Repeated titles (several "Allah's Guarantee" sections) get -2, -3 …
          const base = slugify(label) || `section-${i}`;
          let id = base, n = 2;
          while (document.getElementById(id)) id = `${base}-${n++}`;
          h.id = id;
        }
        const li = document.createElement('li');
        li.className = isDrawer ? 'toc-drawer' : h.tagName === 'H2' ? 'toc-h2' : 'toc-h3';
        if (!isDrawer && h.closest('details')) li.classList.add('toc-in-drawer');   // sections written inside a drawer
        const a = document.createElement('a');
        a.href = `#${h.id}`;
        a.textContent = label;

        a.addEventListener('click', () => {
          const heading = document.getElementById(h.id);
          if (isDrawer) {
            heading.open = true;
          } else if (heading) {
            let node = heading.nextElementSibling;
            while (node && !['H1', 'H2', 'H3'].includes(node.tagName)) {
              if (node.tagName === 'DETAILS' && !node.classList.contains('embed-card')) node.open = true;
              if (node.querySelectorAll) node.querySelectorAll('details:not(.embed-card)').forEach(d => d.open = true);
              node = node.nextElementSibling;
            }
            const parentDetails = heading.closest('details');
            if (parentDetails) parentDetails.open = true;
          }
          closeTOC();
        });

        li.appendChild(a);
        tocList.appendChild(li);
      });

      if (hudTocBtn) hudTocBtn.style.display = 'flex';
      wireTocButton(tocPanel, hudTocBtn);
    }

    // Collection and slot pages: a thin progress bar above the HUD showing the
    // family and card being read. Cards are read top to bottom, so "current" is
    // the last card whose top has passed a probe line near the upper third.
    function buildCollectionProgress(target) {
      const hud = document.getElementById('hudBar');
      if (!hud) return;
      const stops = [];
      let family = '';
      Array.from(target.children).forEach(el => {
        if (el.tagName === 'H3') family = el.textContent.trim();
        else if (el.matches('details.embed-card')) stops.push({ el, family });
      });
      if (stops.length < 2) return;

      let bar = document.getElementById('colProgress');
      if (!bar) {
        bar = document.createElement('div');
        bar.id = 'colProgress';
        bar.className = 'col-progress';
        bar.innerHTML = '<div class="col-progress-text"><span class="col-progress-family"></span>' +
          '<span class="col-progress-card"></span><span class="col-progress-count"></span></div>' +
          '<div class="col-progress-track"><div class="col-progress-fill"></div></div>';
        hud.appendChild(bar);
      }
      const famEl = bar.querySelector('.col-progress-family');
      const cardEl = bar.querySelector('.col-progress-card');
      const countEl = bar.querySelector('.col-progress-count');
      const fillEl = bar.querySelector('.col-progress-fill');
      const n = stops.length;

      let ticking = false;
      function update() {
        ticking = false;
        const probe = window.innerHeight * 0.35;
        const atEnd = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4;
        let idx = -1;
        stops.forEach((s, i) => { if (s.el.getBoundingClientRect().top <= probe) idx = i; });
        bar.hidden = idx < 0;           // still on the intro, above the first card
        if (idx < 0) return;
        const s = stops[idx];
        const r = s.el.getBoundingClientRect();
        const within = Math.min(1, Math.max(0, (probe - r.top) / Math.max(r.height, 1)));
        const frac = atEnd ? 1 : (idx + within) / n;
        famEl.textContent = s.family ? s.family + ' ·' : '';
        cardEl.textContent = s.el.dataset.label || s.el.dataset.path;
        countEl.textContent = (idx + 1) + ' / ' + n;
        fillEl.style.width = (frac * 100).toFixed(1) + '%';
      }
      const schedule = () => { if (!ticking) { ticking = true; requestAnimationFrame(update); } };
      window.addEventListener('scroll', schedule, { passive: true });
      window.addEventListener('resize', schedule);
      // Embeds load async and change heights; recompute as they settle.
      if (window.ResizeObserver) new ResizeObserver(schedule).observe(target);
      update();
    }

    function wireTocButton(tocPanel, hudTocBtn) {
      if (hudTocBtn) {
        hudTocBtn.onclick = (e) => {
          e.stopPropagation();
          if (tocPanel.style.display === 'block') closeTOC();
          else openTOC();
        };
      }

      if (window._tocOutsideBound) return;
      window._tocOutsideBound = true;
      document.addEventListener('click', (e) => {
        if (tocPanel.style.display === 'block' &&
          !tocPanel.contains(e.target) &&
          e.target !== hudTocBtn &&
          !(hudTocBtn && hudTocBtn.contains(e.target))) {
          closeTOC();
        }
      });
    }

    // Collection and slot pages: the TOC lists the embedded cards.
    // Tapping one opens + scrolls to it and unfolds that card's own h2/h3
    // sections underneath (one card unfolded at a time).
    function buildCollectionTOC(target) {
      const tocPanel = document.getElementById('toc');
      const tocList = document.getElementById('tocList');
      const hudTocBtn = document.getElementById('hudTocBtn');
      const cards = target.querySelectorAll('details.embed-card');
      tocList.innerHTML = '';
      if (cards.length < 2) {
        if (tocPanel) tocPanel.style.display = 'none';
        if (hudTocBtn) hudTocBtn.style.display = 'none';
        return;
      }

      const lis = [];
      cards.forEach((card, i) => {
        const li = document.createElement('li');
        li.className = 'toc-h2 toc-card';
        const a = document.createElement('a');
        a.href = '#';
        a.textContent = card.dataset.label || card.dataset.path;
        const sub = document.createElement('ul');
        sub.className = 'toc-sub';
        sub.hidden = true;
        li.append(a, sub);
        lis.push(li);

        a.addEventListener('click', async (e) => {
          e.preventDefault();
          card.open = true;
          card.scrollIntoView({ behavior: 'smooth', block: 'start' });
          const wasOpen = li.classList.contains('is-unfolded');
          lis.forEach(l => { l.classList.remove('is-unfolded'); l.querySelector('.toc-sub').hidden = true; });
          if (wasOpen) return;
          if (!sub.childElementCount) {
            if (!card.querySelector('.embed-footer')) { try { await loadEmbed(card.dataset.path); } catch (_) {} }
            card.querySelectorAll('.embed-body h2, .embed-body h3').forEach((h, j) => {
              if (!h.id) h.id = `emb-${i}-${j}`;
              const sli = document.createElement('li');
              sli.className = h.tagName === 'H2' ? 'toc-h2' : 'toc-h3';
              const sa = document.createElement('a');
              sa.href = `#${h.id}`;
              sa.textContent = h.textContent;
              sa.addEventListener('click', (ev) => {
                ev.preventDefault();
                card.open = true;
                let node = h.nextElementSibling;
                while (node && !['H1', 'H2', 'H3'].includes(node.tagName)) {
                  if (node.tagName === 'DETAILS') node.open = true;
                  if (node.querySelectorAll) node.querySelectorAll('details').forEach(d => d.open = true);
                  node = node.nextElementSibling;
                }
                const pd = h.closest('details:not(.embed-card)');
                if (pd) pd.open = true;
                h.scrollIntoView({ behavior: 'smooth', block: 'start' });
                closeTOC();
              });
              sli.appendChild(sa);
              sub.appendChild(sli);
            });
          }
          if (sub.childElementCount) { li.classList.add('is-unfolded'); sub.hidden = false; }
        });
        tocList.appendChild(li);
      });

      if (hudTocBtn) hudTocBtn.style.display = 'flex';
      wireTocButton(tocPanel, hudTocBtn);
    }

    function openTOC() {
      const tocPanel = document.getElementById('toc');
      const hudTocBtn = document.getElementById('hudTocBtn');
      if (tocPanel) tocPanel.style.display = 'block';
      if (hudTocBtn) hudTocBtn.classList.add('toc-open');
    }

    function closeTOC() {
      const tocPanel = document.getElementById('toc');
      const hudTocBtn = document.getElementById('hudTocBtn');
      if (tocPanel) tocPanel.style.display = 'none';
      if (hudTocBtn) hudTocBtn.classList.remove('toc-open');
    }

    // ════════════════════════════════════════════
    // Auto-expand <details> when URL hash targets one
    // ════════════════════════════════════════════
    function handleHashOpen() {
      if (!window.location.hash) return;
      setTimeout(() => {
        const targetEl = document.querySelector(window.location.hash);
        if (!targetEl) return;
        let parent = targetEl.closest('details');
        while (parent) {
          parent.open = true;
          parent = parent.parentElement ? parent.parentElement.closest('details') : null;
        }
        targetEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 100);
    }

    // ════════════════════════════════════════════
    // Markdown fetch & render
    // ════════════════════════════════════════════
    // Shared by the file loader and the live preview (web/preview.html).
    // Preview only: render block by block so every element carries the
    // source line it came from (data-line) — drives the caret highlight.
    function renderWithLines(src, offset) {
      const tokens = marked.lexer(src);
      const nl = (t) => (t.match(/\n/g) || []).length;
      let line = offset + 1;
      let out = '';
      for (const tok of tokens) {
        const start = line;
        line += nl(tok.raw);
        if (tok.type === 'space') continue;
        const one = [tok];
        one.links = tokens.links;
        const html = marked.parser(one)
          .replace(/^(\s*)<([a-zA-Z][\w-]*)/, `$1<$2 data-line="${start}"`);
        out += html.replace(/(?<!\\)\[\[/g, (m, idx) => `⁠${start + nl(html.slice(0, idx))}⁠[[`);
      }
      return out;
    }

    function focusLine(line, scroll, keepClosed) {
      const target = document.getElementById('markdown-target');
      document.querySelectorAll('.src-hl').forEach(e => e.classList.remove('src-hl'));
      if (!line) return;

      let els;
      if (line <= (window._metaLines || 0)) {
        els = Array.from(document.querySelectorAll('#orb-corner-wrap .orb'));
      } else {
        const all = Array.from(target.querySelectorAll('[data-line]'));
        let best = 0;
        all.forEach(e => { const n = +e.dataset.line; if (n <= line && n > best) best = n; });
        els = all.filter(e => +e.dataset.line === best)
                 .map(e => e.tagName === 'DETAILS' ? (e.querySelector('summary') || e) : e);
        // keepClosed: the reader just clicked a drawer's summary — let that click
        // toggle it instead of force-opening it here and having it toggle shut.
        if (!keepClosed) els.forEach(e => {
          let d = e.parentElement && e.parentElement.closest('details');
          while (d) { d.open = true; d = d.parentElement && d.parentElement.closest('details'); }
        });
      }
      els.forEach(e => e.classList.add('src-hl'));
      if (scroll && els[0]) {
        const r = els[0].getBoundingClientRect();
        if (r.top < 60 || r.bottom > window.innerHeight - 90) {
          els[0].scrollIntoView({ block: 'center', behavior: 'smooth' });
        }
      }
    }

    // ════════════════════════════════════════════
    // Embedded cards:  [label](?file=path/to/card.md "embed")
    // Renders the whole atomic card as a collapsed drawer inside this one.
    // Capped at one level — links inside an embedded card stay plain links.
    // ════════════════════════════════════════════
    const EMBED_TEXT = new Map();      // path → markdown (successful loads)
    const EMBED_PENDING = new Map();   // path → in-flight fetch
    const EMBED_OPEN = new Set();      // paths the reader has expanded (survives preview re-renders)

    function embedGradeClass(meta) {
      const probe = ((meta.grade || meta['right-orb'] || '')).toLowerCase();
      if (/sahih|ṣaḥīḥ/.test(probe)) return 'g-sahih';
      if (/hasan|ḥasan/.test(probe)) return 'g-hasan';
      if (/daif|ḍaʿīf/.test(probe)) return 'g-daif';
      if (/mawdu|mawḍūʿ/.test(probe)) return 'g-mawdu';
      if (/mutawatir|mutawātir/.test(probe)) return 'g-mutawatir';
      return '';
    }

    function loadEmbed(path) {
      if (EMBED_PENDING.has(path)) return EMBED_PENDING.get(path);
      const p = fetch('../' + path)
        .then(res => { if (!res.ok) throw new Error(`HTTP ${res.status}`); return res.text(); })
        .then(md => { EMBED_TEXT.set(path, md); return md; })
        .finally(() => EMBED_PENDING.delete(path));
      EMBED_PENDING.set(path, p);
      return p;
    }

    function fillEmbed(card, md, path, label) {
      const { meta, stripped } = parseMetaBlock(md);
      const m = meta || {};
      const badgeText = m.grade ? m.grade.toUpperCase()
        : (m['right-orb-compact'] || (m['right-orb'] || '').replace(LEADING_ICON_RE, ''));
      const summary = card.querySelector('summary');
      summary.innerHTML = '';
      if (badgeText) {
        const b = document.createElement('span');
        b.className = 'embed-badge ' + embedGradeClass(m);
        b.textContent = badgeText;
        summary.appendChild(b);
      }
      const l = document.createElement('span');
      l.textContent = label;
      summary.appendChild(l);

      const body = card.querySelector('.embed-body');
      body.innerHTML = marked.parse(stripped);
      parseWordStacks(body);

      const foot = document.createElement('div');
      foot.className = 'embed-footer';
      const ref = m['left-orb'] ? document.createElement('span') : null;
      if (ref) { ref.textContent = m['left-orb'] + ' · '; foot.appendChild(ref); }
      const a = document.createElement('a');
      a.href = 'render.html?file=' + encodeURI(path);
      a.target = '_blank'; a.rel = 'noopener';
      a.textContent = 'Open standalone ↗';
      foot.appendChild(a);
      body.appendChild(foot);
    }

    function makeEmbed(path, label, line) {
      const card = document.createElement('details');
      card.className = 'embed-card';
      card.dataset.path = path;
      card.dataset.label = label;
      if (line) card.dataset.line = line;
      card.open = EMBED_OPEN.has(path);
      card.innerHTML = '<summary></summary><div class="embed-body"></div>';
      card.querySelector('summary').textContent = label;
      card.addEventListener('toggle', () => { card.open ? EMBED_OPEN.add(path) : EMBED_OPEN.delete(path); });

      const body = card.querySelector('.embed-body');
      if (EMBED_TEXT.has(path)) {
        fillEmbed(card, EMBED_TEXT.get(path), path, label);   // cached: no flash while typing
      } else {
        body.innerHTML = '<p class="embed-status">Loading…</p>';
        loadEmbed(path)
          .then(md => fillEmbed(card, md, path, label))
          .catch(() => { body.innerHTML = `<p class="embed-status err">⚠️ Could not load <code></code></p>`; body.querySelector('code').textContent = path; });
      }
      return card;
    }

    function expandEmbeds(root) {
      root.querySelectorAll('a[title="embed"]').forEach(a => {
        const m = (a.getAttribute('href') || '').match(/^\?file=([^#]+\.md)$/);
        if (!m) return;
        let path;
        try { path = decodeURI(m[1]).trim(); } catch (e) { path = m[1].trim(); }
        const label = a.textContent.trim() || path;

        let block = a.closest('p, li');
        if (!block) { block = a; while (block.parentElement && block.parentElement !== root) block = block.parentElement; }
        const card = makeEmbed(path, label, block.dataset && block.dataset.line);

        if (block.tagName === 'P' && block.textContent.trim() === a.textContent.trim()) block.replaceWith(card);
        else if (block.tagName === 'LI') block.appendChild(card);
        else block.after(card);
      });
    }

    // Renders markdown with the card pipeline (word stacks, ayah grouping, tooltips, embeds) into a
    // detached element. web/tips.js uses it to draw a glossary entry as a mini card in its popover.
    window.somRenderInto = function (md, el) {
      marked.setOptions({ gfm: true, breaks: false });
      el.innerHTML = marked.parse(md);
      parseWordStacks(el);
      expandEmbeds(el);
    };

    // ════════════════════════════════════════════
    // Live preview: patch, don't rebuild.
    // The builder re-renders after every pause in typing. Replacing the whole card reloaded the
    // follow-along video and every embed and closed the drawers the author had open. Instead the new
    // version is built off-screen and only the blocks that changed are swapped into the live card;
    // untouched blocks (and the iframes, open drawers and pinned video inside them) stay as they are.
    // Used for the preview only; published pages still render in one pass.
    // ════════════════════════════════════════════
    const SIG_TRANSIENT = new Set(['src-hl', 'pinned', 'is-open', 'is-unfolded']);

    // What a block "is", ignoring things that only change at runtime: ids added for the TOC, the
    // open state of drawers, source line numbers, the pinned state of the video, the caret highlight.
    function previewSig(el) {
      return el.outerHTML
        .replace(/ data-line="\d+"/g, '')
        .replace(/ id="[^"]*"/g, '')
        .replace(/ open=""/g, '')
        .replace(/class="([^"]*)"/g, (m, c) => {
          const k = c.split(/\s+/).filter(x => x && !SIG_TRANSIENT.has(x)).join(' ');
          return k ? 'class="' + k + '"' : '';
        })
        .replace(/ +>/g, '>')
        .replace(/📌 Pinned/g, '📌 Follow along');
    }

    const hasLooseText = (el) => Array.from(el.childNodes).some(n => n.nodeType === 3 && n.textContent.trim());

    function lcsPairs(a, b) {   // longest common subsequence of two int arrays → [[i, j], …] in order
      const n = a.length, m = b.length;
      const dp = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
      for (let i = n - 1; i >= 0; i--)
        for (let j = m - 1; j >= 0; j--)
          dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
      const out = [];
      let i = 0, j = 0;
      while (i < n && j < m) {
        if (a[i] === b[j]) { out.push([i, j]); i++; j++; }
        else if (dp[i + 1][j] >= dp[i][j + 1]) i++;
        else j++;
      }
      return out;
    }

    const lineEls = (el) => [el].concat(Array.from(el.querySelectorAll('[data-line]'))).filter(e => e.hasAttribute('data-line'));

    // A kept block keeps its DOM, but its source line numbers may have moved (lines added above it).
    function syncLines(o, n) {
      const a = lineEls(o), b = lineEls(n);
      if (a.length !== b.length) return false;
      a.forEach((e, i) => e.setAttribute('data-line', b[i].getAttribute('data-line')));
      return true;
    }

    // A block that must be replaced still inherits the reader's state: open drawers and the pinned video.
    function carryState(o, n) {
      const drawers = (el) => (el.tagName === 'DETAILS' ? [el] : []).concat(Array.from(el.querySelectorAll('details')));
      const od = drawers(o), nd = drawers(n);
      if (od.length === nd.length) od.forEach((d, i) => { if (!d.classList.contains('embed-card')) nd[i].open = d.open; });
      const videos = (el) => (el.matches('.video-card') ? [el] : []).concat(Array.from(el.querySelectorAll('.video-card')));
      const ov = videos(o), nv = videos(n);
      if (ov.length === nv.length) ov.forEach((v, i) => {
        if (v.classList.contains('pinned')) {
          nv[i].classList.add('pinned');
          const b = nv[i].querySelector('.video-pin-toggle');
          if (b) b.textContent = '📌 Pinned';
        }
      });
    }

    // Make oldP's element children match newP's, touching as little as possible.
    function patchChildren(oldP, newP, depth) {
      const O = Array.from(oldP.children), N = Array.from(newP.children);
      const ids = new Map();
      const id = (s) => { if (!ids.has(s)) ids.set(s, ids.size); return ids.get(s); };
      const pairs = lcsPairs(O.map(el => id(previewSig(el))), N.map(el => id(previewSig(el))));
      let oi = 0, ni = 0;

      // The stretch between two kept blocks: pair up old and new blocks by position.
      const flush = (oEnd, nEnd, ref) => {
        const olds = O.slice(oi, oEnd), news = N.slice(ni, nEnd);
        const k = Math.min(olds.length, news.length);
        for (let x = 0; x < k; x++) {
          const o = olds[x], n = news[x];
          if (depth < 2 && o.tagName === 'DETAILS' && n.tagName === 'DETAILS' && !hasLooseText(o) && !hasLooseText(n)) {
            // a drawer that was edited: patch inside it, so it stays open and its embeds stay loaded
            Array.from(n.attributes).forEach(a => {
              if (a.name !== 'open' && a.name !== 'id' && o.getAttribute(a.name) !== a.value) o.setAttribute(a.name, a.value);
            });
            Array.from(o.attributes).forEach(a => {
              if (a.name !== 'open' && a.name !== 'id' && !n.hasAttribute(a.name) && !SIG_TRANSIENT.has(a.name)) o.removeAttribute(a.name);
            });
            patchChildren(o, n, depth + 1);
          } else {
            carryState(o, n);
            o.replaceWith(n);
          }
        }
        olds.slice(k).forEach(o => o.remove());
        news.slice(k).forEach(n => oldP.insertBefore(n, ref));
      };

      pairs.forEach(([i, j]) => {
        flush(i, j, O[i]);
        if (!syncLines(O[i], N[j])) { carryState(O[i], N[j]); O[i].replaceWith(N[j]); }
        oi = i + 1; ni = j + 1;
      });
      flush(O.length, N.length, null);
    }

    function patchPreview(target, scratch) {
      if (!target.children.length || hasLooseText(target) || hasLooseText(scratch)) {
        target.innerHTML = '';
        while (scratch.firstChild) target.appendChild(scratch.firstChild);
        return;
      }
      patchChildren(target, scratch, 0);
      Array.from(target.childNodes).forEach(n => { if (n.nodeType === 3 && !n.textContent.trim()) n.remove(); });
    }

    function renderCard(md, withLines) {
      const target = document.getElementById('markdown-target');
      marked.setOptions({ gfm: true, breaks: false });
      const { meta, stripped } = parseMetaBlock(md);
      const nlCount = (t) => (t.match(/\n/g) || []).length;
      window._metaLines = nlCount(md) - nlCount(stripped);
      const metaCardHTML = renderMetaCard(meta);

      const orbTarget = document.getElementById('orb-corner-wrap');
      if (orbTarget) {
        orbTarget.innerHTML = metaCardHTML;
        orbTarget.style.display = metaCardHTML ? 'flex' : 'none';
        if (metaCardHTML && !window._orbWatcher) {
          window._orbWatcher = true;
          initOrbScrollWatcher();
        }
      }

      if (withLines) {
        // live preview: build off-screen, then patch only what changed (videos and open drawers survive)
        const scratch = document.createElement('div');
        scratch.innerHTML = renderWithLines(stripped, window._metaLines);
        parseWordStacks(scratch);
        expandEmbeds(scratch);   // before the TOC so embedded headings never enter it
        patchPreview(target, scratch);
      } else {
        target.innerHTML = marked.parse(stripped);
        parseWordStacks(target);
        expandEmbeds(target);   // before the TOC so embedded headings never enter it
      }
      buildTOC(target);

      const h1 = target.querySelector('h1');
      if (h1) document.title = h1.textContent + ' · ' + APP_META.short;
      window._cardMeta = meta || null;
      revealShareButton();
    }

    // ════════════════════════════════════════════
    // Share this card — Web Share API where available (native
    // share sheet: WhatsApp / Messages / etc.), clipboard-copy
    // fallback everywhere else. The URL is just the page's own
    // ?file= link, so the receiver lands on this exact card —
    // and pwa-install.js already shows them the install banner.
    // ════════════════════════════════════════════
    function revealShareButton() {
      const btn = document.getElementById('shareCardBtn');
      if (btn) btn.style.display = '';
    }

    function showShareToast(msg) {
      const toast = document.getElementById('shareToast');
      if (!toast) return;
      toast.textContent = msg;
      toast.hidden = false;
      requestAnimationFrame(() => toast.classList.add('is-visible'));
      clearTimeout(toast._hideTimer);
      toast._hideTimer = setTimeout(() => {
        toast.classList.remove('is-visible');
        setTimeout(() => { toast.hidden = true; }, 200);
      }, 2200);
    }

    async function shareCard() {
      const meta = window._cardMeta || {};
      const h1 = document.querySelector('#markdown-target h1');
      const title = (h1 ? h1.textContent : document.title).trim();
      const source = (meta['left-orb'] || '').replace(LEADING_ICON_RE, '').trim();
      const grade = (meta['right-orb'] || meta.grade || '').replace(LEADING_ICON_RE, '').trim();
      const tagline = [source, grade].filter(Boolean).join(' · ');
      const text = `${title}${tagline ? '\n' + tagline : ''}\n\nRecited word-by-word, fully sourced — on ${APP_META.name}.`;
      const url = window.location.href;

      if (navigator.share) {
        try { await navigator.share({ title, text, url }); }
        catch (err) { if (err && err.name !== 'AbortError') console.warn('Share failed:', err); }
        return;
      }

      try {
        await navigator.clipboard.writeText(url);
        showShareToast('Link copied — paste it anywhere');
      } catch (err) {
        showShareToast(url);
      }
    }

    document.getElementById('shareCardBtn').addEventListener('click', shareCard);

    document.addEventListener('DOMContentLoaded', async () => {
      const params = new URLSearchParams(window.location.search);
      const file = params.get('file');
      const target = document.getElementById('markdown-target');

      // Preview mode: web/preview.html embeds this page and posts markdown
      // in, so the pasted card renders with exactly the live styling.
      if (params.get('preview')) {
        target.innerHTML = '';

        // Same HUD as a published card, minus the navigation: Back / Next
        // and Home are greyed out, the TOC works against the pasted markdown.
        const hud = document.getElementById('somHudNav');
        hud.innerHTML = `${somRenderHudEnd(null, 'prev')}${somRenderHudEnd(null, 'next')}`;
        hud.hidden = false;
        const hudHome = document.getElementById('hudHome');
        hudHome.removeAttribute('href');
        hudHome.classList.add('is-disabled');
        hudHome.style.cssText = 'opacity:.35;cursor:not-allowed;';
        hudHome.title = 'Not linked in preview';

        // Click anywhere on the card → tell the editor which source line it came from.
        document.addEventListener('click', (e) => {
          const a = e.target.closest('a');
          if (a && a.target !== '_blank' && !(a.getAttribute('href') || '').startsWith('#')) e.preventDefault();   // keep the preview in place
          if (e.target.closest('#hudBar, #toc')) return;
          let line = 0;
          const orb = e.target.closest('#orb-corner-wrap');
          if (orb) line = 1;
          else {
            const el = e.target.closest('[data-line]');
            if (el) line = +el.dataset.line;
          }
          if (line) {
            focusLine(line, false, !!e.target.closest('summary'));
            window.parent.postMessage({ type: 'som-goto', line }, '*');
          }
        });

        window.addEventListener('message', (e) => {
          if (e.data && e.data.type === 'som-focus') { focusLine(e.data.line, true); return; }
          if (!e.data || e.data.type !== 'som-preview') return;
          const y = window.scrollY;
          try { renderCard(e.data.md || '', true); focusLine(e.data.line, false); }
          catch (err) { target.innerHTML = `<p style="color: var(--accent-crimson);">⚠️ ${err.message}</p>`; }
          window.scrollTo(0, y);
        });
        // Embedded players (QuranWBW, YouTube) grab keyboard focus when they load. Tell the builder, so it
        // can hand the keyboard back to the editor, and tell it when the reader really clicks in here.
        document.addEventListener('load', (e) => {
          if (e.target && e.target.tagName === 'IFRAME') window.parent.postMessage({ type: 'som-iframe-loaded' }, '*');
        }, true);
        document.addEventListener('pointerdown', (e) => {
          if (e.isTrusted) window.parent.postMessage({ type: 'som-preview-touched' }, '*');
        }, true);
        window.parent.postMessage({ type: 'som-preview-ready' }, '*');
        return;
      }

      // Built first, and unconditionally — a card that failed to load is
      // exactly when the reader most needs a way back to the menu.
      somBuildCardNav();

      // ?collection=<set id>  — a shipped set;  ?slot=<prayer.role> — one slot of the reader's plan
      // (web/plan.js). Either becomes a card of embeds, same drawers as authored cards.
      if (params.get('collection') || params.get('slot') || params.get('favorites') === '1') {
        try {
          const id = params.get('collection');
          const presets = (typeof PRESET_COLLECTIONS !== 'undefined') ? PRESET_COLLECTIONS : [];
          const preset = id ? presets.find(c => c.id === id) : null;
          const cols = JSON.parse(localStorage.getItem('som-collections') || '[]');
          const slotId = params.get('slot');
          const col = slotId
            ? (window.SomPlan ? SomPlan.asCollection(slotId) : null)
            : (preset || (Array.isArray(cols) ? (id ? cols.find(c => c.id === id) : cols[0]) : null));
          if (!col) {
            target.innerHTML = `<p style="color: var(--accent-crimson);">⚠️ Collection not found. <a href="../index.html">Back to home</a>.</p>`;
            return;
          }
          const items = Array.isArray(col.items) ? col.items : [];
          const realItems = items.filter(it => it && it.type !== 'family');
          if (!realItems.length) {
            target.innerHTML = `<p class="embed-status">Nothing in here yet. Open <a href="../index.html">Action view</a> and tap <strong>✎ Edit</strong> to fill this slot.</p>`;
            return;
          }
          const esc = s => String(s).replace(/([\\\[\]])/g, '\\$1');
          // Family-divider rows become a subheading; real items become embeds.
          const link = it => it.type === 'family'
            ? `### ${it.icon ? it.icon + ' ' : ''}${esc(it.label)}`
            : `[${esc(it.label || it.path)}](?file=${encodeURI(it.path).replace(/[()]/g, c => '%' + c.charCodeAt(0).toString(16).toUpperCase())} "embed")`;
          // A set is read top to bottom — unfold every card so it scrolls like one page.
          realItems.forEach(it => EMBED_OPEN.add(it.path));
          window._collectionToc = true;
          const moreLine = col.moreHref
            ? `[Read the etiquette →](?file=${encodeURI(col.moreHref)})\n\n`
            : '';
          renderCard(
            `# ${col.name || 'Collection'}\n\n` +
            (col.summary ? `*${col.summary}*\n\n` : (col.note ? `*${col.note}*\n\n` : '')) +
            moreLine +
            items.map(link).join('\n\n') + '\n');
          buildCollectionProgress(target);
        } catch (err) {
          console.error(err);
          target.innerHTML = `<p style="color: var(--accent-crimson);">⚠️ Could not load this collection.</p>`;
        }
        return;
      }

      if (!file) {
        target.innerHTML = `<p style="color: var(--accent-crimson);">⚠️ No file specified. Append <code>?file=yourfile.md</code> to the URL.</p>`;
        return;
      }

      try {
        const res = await fetch('../' + file);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        renderCard(await res.text());
        handleHashOpen();
      } catch (err) {
        console.error(err);
        target.innerHTML = `
          <p style="color: var(--accent-crimson);">
            ⚠️ <strong>Could not load file:</strong> <code>${file}</code><br>
            <span style="color: var(--text-taupe); font-size: 0.85em;">Check the path and that the file exists relative to this HTML.</span>
          </p>`;
      }
    });

    document.fonts.ready.then(() => {
      const hasUthmanic = Array.from(document.fonts).some(f => f.family.includes('UthmanicHafs') && f.status === 'loaded');
      if (!hasUthmanic) {
        console.info('ℹ️  KFGQPC UthmanicHafs not found at ../fonts/UthmanicHafsVer18.ttf — falling back to Amiri Quran.');
      }
    });
  </script>

  <!-- ═══ PWA service worker — offline support ═══ -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('../sw.js').catch((err) => {
          console.warn('SW registration failed:', err);
        });
      });
    }
  </script>
  <script src="pwa-install.js"></script>
</body>
</html>
