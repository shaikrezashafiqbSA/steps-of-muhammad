  <style type="text/tailwindcss">
    /* ════════════════════════════════════════════════
       KFGQPC UTHMANIC HAFS — self-hosted
       ════════════════════════════════════════════════ */
    @font-face {
      font-family: 'UthmanicHafs';
      src: url('../fonts/UthmanicHafsVer18.ttf') format('truetype');
      font-display: swap;
    }

    /* ════════════════════════════════════════════════
       WARM TERRACOTTA MINIMALIST THEME
       ════════════════════════════════════════════════ */
    :root {
      --bg-cream:        #FFFBF1;
      --structural:      #7D5243;
      --divider-sand:    #E6DCD0;
      --text-espresso:   #3A2E2B;
      --text-taupe:      #7A6F6C;
      --accent-crimson:  #A94442;
      --accent-olive:    #3C763D;
      --accent-ochre:    #B08A4B;

      --orb-font-size: 0.72rem;
      --orb-padding-y: 0.4rem;
      --orb-padding-x: 0.85rem;
      --orb-radius: 999px;
    }

    html, body {
      background: var(--bg-cream);
      color: var(--text-espresso);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      letter-spacing: 0.01em;
      scroll-behavior: smooth;
    }

    /* Editor-caret highlight (preview mode only) */
    .src-hl {
      background: rgba(176, 138, 75, 0.22) !important;
      box-shadow: 0 0 0 4px rgba(176, 138, 75, 0.22), 0 0 0 5px rgba(176, 138, 75, 0.55);
      border-radius: 6px;
      transition: background 0.15s ease, box-shadow 0.15s ease;
    }

    .paper-card {
      background: var(--bg-cream);
      box-shadow:
        0 1px 2px rgba(125, 82, 67, 0.05),
        0 8px 24px rgba(125, 82, 67, 0.08);
      border: 1px solid var(--divider-sand);
      border-radius: 8px;
    }

    /* ════════════════════════════════════════════════
       MARKDOWN BODY TYPOGRAPHY
       ════════════════════════════════════════════════ */
    .markdown-body h1 {
      color: var(--structural);
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      margin-bottom: 0.5rem;
      padding-bottom: 0.75rem;
      border-bottom: 2px solid var(--divider-sand);
    }
    .markdown-body h2 {
      color: var(--accent-crimson);
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      margin-top: 2rem;
      margin-bottom: 0.75rem;
      padding-bottom: 0.25rem;
      border-bottom: 1px solid var(--divider-sand);
      scroll-margin-top: 1rem;
    }
    .markdown-body h3 {
      color: var(--structural);
      font-size: 1rem;
      font-weight: 600;
      margin-top: 1.25rem;
      margin-bottom: 0.5rem;
      scroll-margin-top: 1rem;
    }
    .markdown-body p {
      color: var(--text-espresso);
      font-size: 0.9rem;
      line-height: 1.7;
      margin-bottom: 1rem;
    }
    .markdown-body ul, .markdown-body ol {
      color: var(--text-espresso);
      font-size: 0.9rem;
      line-height: 1.7;
      margin-bottom: 1rem;
      padding-left: 1.5rem;
    }
    .markdown-body ul { list-style: disc; }
    .markdown-body ol { list-style: decimal; }
    .markdown-body li { margin-bottom: 0.35rem; }
    .markdown-body li strong { color: var(--accent-ochre); font-weight: 600; }
    .markdown-body strong { color: var(--structural); font-weight: 600; }
    .markdown-body em { color: var(--text-taupe); font-style: italic; }
    .markdown-body hr {
      border: none;
      border-top: 1px solid var(--divider-sand);
      margin: 2rem 0;
    }
    .markdown-body a {
      color: var(--accent-olive);
      text-decoration: underline;
      text-decoration-style: dotted;
      text-underline-offset: 3px;
    }
    .markdown-body a:hover { color: var(--accent-crimson); }

    .markdown-body blockquote {
      border-left: 3px solid var(--accent-ochre);
      background: rgba(176, 138, 75, 0.06);
      padding: 0.75rem 1rem;
      margin: 1rem 0;
      border-radius: 0 4px 4px 0;
      color: var(--text-espresso);
      font-style: italic;
      font-size: 0.92rem;
    }
    .markdown-body code {
      font-family: 'JetBrains Mono', 'Consolas', monospace;
      font-size: 0.82em;
      background: rgba(125, 82, 67, 0.08);
      color: var(--structural);
      padding: 0.1rem 0.35rem;
      border-radius: 3px;
    }

    /* ════════════════════════════════════════════════
       FLOATING CORNER ORBS (v4.4)
       Sticky floating pills in top-left and top-right corners.
       Initial view: full text (📖 Musnad Aḥmad 3712)
       After scroll:  compact form (📖 only)
       Author controls colors via ::meta color fields.
       ════════════════════════════════════════════════ */

    .orb-corner-wrap {
      position: fixed;
      top: 1rem;
      left: 1rem;
      right: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      z-index: 90;
    }

    .orb-corner-wrap .orb {
      pointer-events: auto;
    }

    .orb {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: var(--orb-font-size);
      font-weight: 600;
      letter-spacing: 0.02em;
      padding: var(--orb-padding-y) var(--orb-padding-x);
      border-radius: var(--orb-radius);
      box-shadow:
        0 2px 8px rgba(125, 82, 67, 0.12),
        0 1px 3px rgba(125, 82, 67, 0.08);
      white-space: nowrap;
      max-width: 100%;
      transition:
        max-width 0.35s cubic-bezier(0.4, 0, 0.2, 1),
        padding 0.3s ease,
        opacity 0.3s ease;
      overflow: hidden;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .orb .orb-label {
      transition: opacity 0.25s ease, max-width 0.35s ease;
      display: inline-block;
      white-space: nowrap;
    }

    body.orbs-compact .orb .orb-label {
      opacity: 0;
      max-width: 0;
      margin-left: 0;
      overflow: hidden;
    }

    body.orbs-compact .orb {
      padding: var(--orb-padding-y) calc(var(--orb-padding-y) + 0.1rem);
    }

    .orb-left {
      background: rgba(255, 251, 241, 0.92);
      color: var(--text-espresso);
      border: 1px solid var(--divider-sand);
    }

    .orb-right {
      color: #FFFBF1;
      border: 1px solid transparent;
      background: rgba(125, 82, 67, 0.85);
    }
    .orb-right-sahih     { background: #3C763D; }
    .orb-right-hasan     { background: #2C7BB0; }
    .orb-right-daif      { background: #B08A4B; }
    .orb-right-mawdu     { background: #A94442; }
    .orb-right-mutawatir { background: #2D5F2D; }
    .orb-right-neutral   {
      background: rgba(255, 251, 241, 0.92);
      color: var(--text-espresso);
      border: 1px solid var(--divider-sand);
    }

    @media (max-width: 640px) {
      :root {
        --orb-font-size: 0.62rem;
        --orb-padding-y: 0.32rem;
        --orb-padding-x: 0.65rem;
      }
      .orb-corner-wrap {
        top: 0.6rem;
        left: 0.6rem;
        right: 0.6rem;
      }
      .orb {
        gap: 0.25rem;
        box-shadow:
          0 1px 4px rgba(125, 82, 67, 0.15),
          0 1px 2px rgba(125, 82, 67, 0.1);
      }
    }

    /* ════════════════════════════════════════════════
       FOLLOW-ALONG VIDEO PANE (v4.5)
       Normal embed by default (scrolls away like any
       image). Reader can pin it via the 📌 button so it
       freezes near the top of the viewport (below the
       orbs) while they scroll the word-by-word text
       beneath it — useful for learners, skippable for
       those who've memorized it. Resets to unpinned on
       every page load (no persistence).
       ════════════════════════════════════════════════ */

    .markdown-body .video-card {
      position: relative;
      max-width: 360px;
      margin: 0 auto 1.25rem;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(125, 82, 67, 0.25);
      border: 1px solid var(--divider-sand);
      transition: max-width 0.25s ease, top 0.25s ease;
    }
    .markdown-body .video-card iframe {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: none;
      display: block;
    }
    .markdown-body .video-card.pinned {
      position: sticky;
      top: 4rem;
      z-index: 70;
      max-width: 240px;
    }

    .video-pin-toggle {
      position: absolute;
      bottom: 6px;
      right: 6px;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      background: rgba(0, 0, 0, 0.6);
      border: none;
      border-radius: 999px;
      color: #fff;
      padding: 0.3rem 0.65rem;
      font-family: 'Inter', sans-serif;
      font-size: 0.68rem;
      font-weight: 600;
      cursor: pointer;
      z-index: 5;
      backdrop-filter: blur(2px);
      transition: background 0.15s ease;
    }
    .video-pin-toggle:hover { background: rgba(0, 0, 0, 0.8); }
    .markdown-body .video-card.pinned .video-pin-toggle {
      background: var(--accent-crimson);
    }
    @media (max-width: 640px) {
      .markdown-body .video-card.pinned { top: 3.2rem; max-width: 180px; }
    }

    /* ════════════════════════════════════════════════
       FLOATING TOC PANEL (v4.1)
       ════════════════════════════════════════════════ */

    .toc-floating-panel {
      position: fixed;
      bottom: 7.5rem;
      right: auto;
      top: auto;
      left: 50%;
      transform: translateX(-50%);
      max-width: 22rem;
      width: min(22rem, calc(100vw - 3rem));
      background: var(--bg-cream);
      border: 1px solid var(--divider-sand);
      border-radius: 8px;
      box-shadow:
        0 4px 12px rgba(125, 82, 67, 0.1),
        0 12px 36px rgba(125, 82, 67, 0.12);
      padding: 0.85rem 1.1rem;
      z-index: 110;
      max-height: 55vh;
      overflow-y: auto;
    }

    .toc-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .toc-list li { margin: 0; padding: 0; }
    .toc-list a {
      display: block;
      padding: 0.4rem 0.5rem;
      font-size: 0.82rem;
      color: var(--text-espresso);
      text-decoration: none;
      border-radius: 4px;
      border-left: 2px solid transparent;
      transition: all 0.15s ease;
    }
    .toc-list a:hover {
      background: rgba(125, 82, 67, 0.08);
      border-left-color: var(--structural);
      color: var(--structural);
    }
    .toc-list .toc-h2 { font-weight: 600; }
    .toc-list .toc-title a { font-weight: 700; padding-bottom: 0.5rem; margin-bottom: 0.2rem; border-bottom: 1px solid rgba(125, 82, 67, 0.15); border-radius: 4px 4px 0 0; }
    .toc-list .toc-title a::before { content: '↑'; margin-right: 0.45rem; color: var(--accent-ochre, #B08A4B); }
    .toc-list .toc-card > a::after { content: '▸'; float: right; color: var(--text-taupe); }
    .toc-list .toc-card.is-unfolded > a::after { content: '▾'; }
    .toc-list .toc-card.is-unfolded > a { color: var(--structural); border-left-color: var(--structural); }
    .toc-list .toc-sub { list-style: none; margin: 0 0 0.3rem 0.6rem; padding: 0; }
    .toc-list .toc-sub .toc-h2 a { padding-left: 1rem; font-size: 0.78rem; font-weight: 600; }
    .toc-list .toc-sub .toc-h3 a { padding-left: 1.7rem; }
    .markdown-body details.embed-card { scroll-margin-top: 1rem; }
    .toc-list .toc-h3 a {
      padding-left: 1.5rem;
      font-size: 0.76rem;
      color: var(--text-taupe);
    }
    .toc-list .toc-drawer a {
      padding-left: 1.5rem;
      font-size: 0.76rem;
      color: var(--text-taupe);
    }
    .toc-list .toc-in-drawer a { padding-left: 2.6rem; }
    .toc-list .toc-drawer a::before { content: '▸'; margin-right: 0.45rem; color: var(--accent-ochre, #B08A4B); }

    /* ════════════════════════════════════════════════
       READING MODE FAN (v5.1)
       The Rumi slot in the HUD tool row toggles transliteration
       on a tap; pressing and holding it (or right-clicking)
       pops a stack of readable text pills upward, one per
       reading mode, for the two less common modes.
       ════════════════════════════════════════════════ */

    .mode-fan {
      position: relative;
      display: flex;
      align-items: stretch;
      flex: 1 1 0;
      min-width: 0;
    }

    .mode-fan-trigger.fan-open {
      background: rgba(125, 82, 67, 0.12);
      box-shadow: inset 0 1px 3px rgba(125, 82, 67, 0.2);
    }

    .mode-fan-items {
      position: absolute;
      bottom: calc(100% + 0.6rem);
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 0.4rem;
      pointer-events: none;
    }

    .mode-fan-item {
      padding: 0.4rem 0.95rem;
      border-radius: 999px;
      border: 1px solid var(--divider-sand);
      background: var(--bg-cream);
      box-shadow: 0 2px 8px rgba(125, 82, 67, 0.15);
      font-size: 0.72rem;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      color: var(--text-espresso);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      opacity: 0;
      transform: translateY(10px) scale(0.85);
      transition:
        opacity 0.22s ease,
        transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1),
        background 0.15s ease,
        box-shadow 0.15s ease;
    }

    .mode-fan.fan-open .mode-fan-items {
      pointer-events: auto;
    }
    .mode-fan.fan-open .mode-fan-item {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .mode-fan.fan-open .mode-fan-item:nth-child(1) { transition-delay: 0.00s; }
    .mode-fan.fan-open .mode-fan-item:nth-child(2) { transition-delay: 0.04s; }
    .mode-fan.fan-open .mode-fan-item:nth-child(3) { transition-delay: 0.08s; }
    .mode-fan.fan-open .mode-fan-item:nth-child(4) { transition-delay: 0.12s; }

    .mode-fan-item:hover {
      background: rgba(176, 138, 75, 0.15);
      box-shadow: 0 4px 14px rgba(125, 82, 67, 0.22);
    }

    .mode-fan-item.active {
      background: rgba(176, 138, 75, 0.18);
      border-color: rgba(176, 138, 75, 0.55);
      color: var(--structural);
    }

    @media (max-width: 640px) {
      .mode-fan-items { gap: 0.35rem; bottom: calc(100% + 0.5rem); }
      .mode-fan-item { font-size: 0.66rem; padding: 0.32rem 0.75rem; }
    }

    /* ════════════════════════════════════════════════
       ZOOM ENGINE (v4.2)
       ════════════════════════════════════════════════ */

    body[data-zoom="1"] { --zoom-arabic: 0.55; --zoom-text: 0.65; --zoom-spacing: 0.25; }
    body[data-zoom="2"] { --zoom-arabic: 0.65; --zoom-text: 0.73; --zoom-spacing: 0.35; }
    body[data-zoom="3"] { --zoom-arabic: 0.75; --zoom-text: 0.81; --zoom-spacing: 0.45; }
    body[data-zoom="4"] { --zoom-arabic: 0.85; --zoom-text: 0.90; --zoom-spacing: 0.55; }
    body[data-zoom="5"] { --zoom-arabic: 1.00; --zoom-text: 1.00; --zoom-spacing: 0.70; }

    body { --zoom-arabic: 1; --zoom-text: 1; --zoom-spacing: 1; }

    body[data-zoom] .markdown-body .ayah .w > b {
      font-size: calc(2.1rem * var(--zoom-arabic));
    }
    body[data-zoom][data-mode="arabic-first"] .ayah .w > b {
      font-size: calc(2.3rem * var(--zoom-arabic));
    }
    body[data-zoom][data-mode="arabic-only"] .ayah .w > b {
      font-size: calc(2.6rem * var(--zoom-arabic));
    }
    body[data-zoom][data-mode="verbal"] .ayah .w > b {
      font-size: calc(1.6rem * var(--zoom-arabic));
    }

    body[data-zoom] .markdown-body .ayah .w > i {
      font-size: calc(0.78rem * var(--zoom-text));
    }
    body[data-zoom] .markdown-body .ayah .w > u {
      font-size: calc(0.7rem * var(--zoom-text));
    }
    body[data-zoom][data-mode="verbal"] .ayah .w > u {
      font-size: calc(1rem * var(--zoom-text));
    }

    body[data-zoom] .markdown-body p,
    body[data-zoom] .markdown-body ul,
    body[data-zoom] .markdown-body ol {
      font-size: calc(0.9rem * var(--zoom-text));
    }
    body[data-zoom] .markdown-body blockquote {
      font-size: calc(0.92rem * var(--zoom-text));
    }
    body[data-zoom] .markdown-body h1 {
      font-size: calc(1.75rem * var(--zoom-text));
    }
    body[data-zoom] .markdown-body h2 {
      font-size: calc(1.25rem * var(--zoom-text));
    }
    body[data-zoom] .markdown-body h3 {
      font-size: calc(1rem * var(--zoom-text));
    }

    body[data-zoom] .markdown-body .ayah {
      padding: calc(1.4rem * var(--zoom-spacing)) calc(1.1rem * var(--zoom-spacing)) calc(1.1rem * var(--zoom-spacing));
      gap: calc(0.4rem * var(--zoom-spacing)) calc(0.85rem * var(--zoom-spacing));
      margin: calc(1.5rem * var(--zoom-spacing)) 0;
    }
    body[data-zoom] .markdown-body .ayah .w {
      min-width: calc(60px * var(--zoom-spacing));
      padding: calc(0.35rem * var(--zoom-spacing)) calc(0.25rem * var(--zoom-spacing));
    }

    /* ════════════════════════════════════════════════
       AYAH BLOCK — Quran-app style word-grid
       ════════════════════════════════════════════════ */
    .markdown-body .ayah {
      direction: rtl;
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-start;
      align-items: flex-start;
      gap: 0.4rem 0.85rem;
      background: rgba(230, 220, 208, 0.22);
      border: 1px solid var(--divider-sand);
      border-radius: 10px;
      padding: 1.4rem 1.1rem 1.1rem;
      margin: 1.5rem 0;
    }

    .markdown-body .ayah .w {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      text-align: center;
      min-width: 60px;
      padding: 0.35rem 0.25rem;
      border-radius: 6px;
      transition: background 0.15s ease;
    }
    .markdown-body .ayah .w:hover {
      background: rgba(125, 82, 67, 0.06);
    }

    .markdown-body .ayah .w > b {
      font-family: 'UthmanicHafs', 'Amiri Quran', 'Scheherazade New', serif;
      font-weight: 400;
      font-size: 2.1rem;
      line-height: 1.6;
      color: var(--text-espresso);
      direction: rtl;
      letter-spacing: 0;
    }

    .markdown-body .ayah .w > i {
      font-family: 'Inter', sans-serif;
      font-style: normal;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--text-espresso);
      direction: ltr;
      margin-top: 0;
      line-height: 1.3;
      max-width: 130px;
    }

    .markdown-body .ayah .w > u {
      font-family: 'Inter', sans-serif;
      text-decoration: none;
      font-style: italic;
      font-size: 0.7rem;
      color: var(--accent-ochre);
      direction: ltr;
      margin-top: 0.1rem;
      line-height: 1.3;
      letter-spacing: 0.02em;
      max-width: 130px;
    }

    /* ════════════════════════════════════════════════
       READING MODES
       ════════════════════════════════════════════════ */
    body[data-mode="arabic-first"] .ayah .w > u { display: none; }
    body[data-mode="arabic-first"] .ayah .w > b { font-size: 2.3rem; }

    body[data-mode="verbal"] .ayah .w > b {
      font-size: 1.6rem;
      opacity: 0.65;
      line-height: 2.2;

    /* ════════════════════════════════════════════════
       COLLAPSIBLE DETAILS — Hadith narration drawer
       ════════════════════════════════════════════════ */
    .markdown-body details {
      background: rgba(125, 82, 67, 0.04);
      border: 1px solid var(--divider-sand);
      border-left: 3px solid var(--accent-ochre);

      user-select: none;
      padding: 0.15rem 0;

    .markdown-body summary::before {
      content: '▶';

      font-size: 0.65rem;
      color: var(--accent-ochre);
      transition: transform 0.2s ease;

    .markdown-body details[open] summary::before {
      transform: rotate(90deg);

      margin-top: 0.85rem;
    }
    .markdown-body details .ayah {
      background: rgba(230, 220, 208, 0.35);
    }
    .markdown-body details blockquote {
      background: rgba(125, 82, 67, 0.04);
      font-size: 0.85rem;
    }

    /* ════════════════════════════════════════════════
       HIKMAH — a rare-item gleam
       The box is either a drawer whose summary carries the {{ Hikmah | @hikmah }} glossary
       word, or a plain "## Hikmah" section (wrapped in .hikmah-box by wrapHikmahSections).
       Warm gold edge, a slow pulsing glow, and a light sweep across the whole box.
       ════════════════════════════════════════════════ */
    .markdown-body details:has(> summary .som-tip[data-kalima="hikmah"]),
    .markdown-body .hikmah-box {
      position: relative; overflow: hidden;
      border: 1px solid rgba(201, 162, 74, 0.7);
      border-left: 3px solid #b8892f;
      border-radius: 6px;
      background-image: linear-gradient(135deg, rgba(212, 175, 55, 0.14), rgba(255, 244, 214, 0.38) 45%, rgba(212, 175, 55, 0.12));
      box-shadow: 0 0 0 1px rgba(212, 175, 55, 0.3), 0 0 14px rgba(212, 175, 55, 0.25);
      animation: hikmah-glow 3.6s ease-in-out infinite;
    }
    .markdown-body .hikmah-box { padding: 0.4rem 1rem 0.85rem; margin: 1.25rem 0; }
    .markdown-body .hikmah-box > h2 { margin-top: 0.6rem; }
    .markdown-body details:has(> summary .som-tip[data-kalima="hikmah"]) > summary { color: #6b4a12; }
    .markdown-body details:has(> summary .som-tip[data-kalima="hikmah"])::after,
    .markdown-body .hikmah-box::after {
      content: ''; position: absolute; top: 0; bottom: 0; left: -60%; width: 30%;
      background: linear-gradient(105deg, transparent, rgba(255, 255, 255, 0.6), transparent);
      transform: skewX(-18deg); pointer-events: none; z-index: 2;
      animation: hikmah-sheen 4.4s ease-in-out infinite;
    }
    @keyframes hikmah-sheen { 0%, 55% { left: -60%; } 100% { left: 130%; } }
    @keyframes hikmah-glow {
      0%, 100% { box-shadow: 0 0 0 1px rgba(212, 175, 55, 0.3), 0 0 10px rgba(212, 175, 55, 0.18); }
      50%      { box-shadow: 0 0 0 1px rgba(212, 175, 55, 0.5), 0 0 22px rgba(212, 175, 55, 0.42); }
    }
    @media (prefers-reduced-motion: reduce) {
      .markdown-body details:has(> summary .som-tip[data-kalima="hikmah"]), .markdown-body .hikmah-box,
      .markdown-body details:has(> summary .som-tip[data-kalima="hikmah"])::after, .markdown-body .hikmah-box::after { animation: none; }

    /* ════════════════════════════════════════════════
       BOTTOM HUD BAR (v5.1)
       Full-width bar docked to the bottom of the viewport,
       two tiers inside a centred column:
         1. title strip — Back / Next with the short card name,
            built from the shared menu tree in nav-data.js;
            tucks away while scrolling down, returns on scroll up
         2. tool row — icon over caption: Home · Contents ·
            Rumi · Size · Share
       The page gets extra bottom padding so the bar never
       covers the closing content or footer.
       ════════════════════════════════════════════════ */
    .hud-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: rgba(255, 251, 241, 0.96);
      border-top: 1px solid var(--divider-sand);
      box-shadow: 0 -2px 12px rgba(125, 82, 67, 0.08);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .hud-inner { max-width: 40rem; margin: 0 auto; }

    /* ── Tier 1: title strip ── */
    .hud-nav {
      display: flex;
      align-items: stretch;
      overflow: hidden;
      max-height: 4.5rem;
      border-bottom: 1px solid var(--divider-sand);
      transition: max-height 0.22s ease, opacity 0.18s ease;
    }
    .hud-nav[hidden] { display: none; }
    .hud-nav.is-tucked { max-height: 0; opacity: 0; border-bottom-width: 0; }

    .hud-nav-btn {
      flex: 1 1 0;
      display: flex;
      align-items: center;
      gap: 0.45rem;
      min-width: 0;
      min-height: 2.9rem;
      padding: 0.45rem 0.8rem;
      color: var(--text-espresso);
      text-decoration: none;
      transition: background 0.15s ease;
    }
    a.hud-nav-btn:hover { background: rgba(176, 138, 75, 0.12); }
    .hud-nav-btn.is-disabled { opacity: 0.35; cursor: not-allowed; }
    .hud-nav-end {
      justify-content: flex-end;
      text-align: right;
      border-left: 1px solid var(--divider-sand);
    }

    .hud-nav-arrow {
      flex-shrink: 0;
      color: var(--accent-ochre);
      font-weight: 700;
      font-size: 0.95rem;
    }

    .hud-nav-text {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .hud-nav-kicker {
      font-size: 0.68rem;
      font-weight: 500;
      line-height: 1.1;
      color: var(--text-taupe);
    }
    .hud-nav-label {
      font-size: 0.8rem;
      font-weight: 600;
      line-height: 1.25;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Tier 2: tool row ── */
    .hud-tools {
      display: flex;
      align-items: stretch;
    }
    .hud-slot {
      flex: 1 1 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.2rem;
      padding: 0.5rem 0.15rem 0.4rem;
      background: transparent;
      border: 0 solid var(--divider-sand);
      color: var(--structural);
      font-family: 'Inter', sans-serif;
      text-decoration: none;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s ease;
    }
    .hud-slot:hover:not(:disabled) { background: rgba(176, 138, 75, 0.12); }
    .hud-slot.toc-open { background: rgba(125, 82, 67, 0.12); }
    .hud-tools > * + * { border-left: 1px solid var(--divider-sand); }

    .hud-slot-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 1.6rem;
    }
    .hud-slot-icon svg {
      width: 1.4rem;
      height: 1.4rem;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .hud-slot-cap {
      font-size: 0.7rem;
      font-weight: 500;
      line-height: 1.1;
      color: var(--text-espresso);
      white-space: nowrap;
    }

    /* Rumi: outlined when off, filled when on */
    .rumi-glyph {
      font-size: 0.8rem;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.02em;
      padding: 0.2rem 0.4rem;
      border: 1.5px solid currentColor;
      border-radius: 6px;
    }
    .hud-slot.is-on .rumi-glyph {
      background: var(--accent-ochre);
      border-color: var(--accent-ochre);
      color: var(--bg-cream);
    }

    /* Size: two direct buttons share one captioned slot */
    .hud-size {
      flex: 1.5 1 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.2rem;
      padding: 0.5rem 0.15rem 0.4rem;
    }
    .hud-size-btns { display: flex; align-items: center; height: 1.6rem; }
    .hud-size-btn {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 0.05rem;
      min-width: 2.3rem;
      height: 1.9rem;
      padding: 0 0.4rem;
      background: transparent;
      border: none;
      border-radius: 6px;
      color: var(--structural);
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      line-height: 1.9rem;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s ease;
    }
    .hud-size-btn:hover:not(:disabled) { background: rgba(176, 138, 75, 0.12); }
    .hud-size-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .hud-size-btn .zoom-glyph { color: var(--structural); }
    .hud-size-btn .zg-sm { font-size: 0.85rem; }
    .hud-size-btn .zg-lg { font-size: 1.3rem; }
    .hud-size-btn .zg-sign { font-size: 0.85rem; color: var(--accent-ochre); }

    .zoom-glyph { font-weight: 700; }

    .share-toast {
      position: fixed;
      left: 50%;
      bottom: 8rem;
      transform: translateX(-50%) translateY(6px);
      z-index: 120;
      background: var(--structural);
      color: var(--bg-cream);
      font-family: 'Inter', sans-serif;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 0.6rem 1.1rem;
      border-radius: 999px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      white-space: nowrap;
    }
    .share-toast.is-visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Collection / slot pages: "where am I" strip riding on top of the HUD bar */
    .col-progress {
      position: absolute;
      left: 0; right: 0; bottom: 100%;
      padding: 0.35rem 1rem 0;

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);

    .col-progress-text {

    }
    .col-progress-family { color: var(--accent-ochre); font-weight: 600; flex: none; }
    .col-progress-card { color: var(--text-espresso); overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .col-progress-count { margin-left: auto; flex: none; font-variant-numeric: tabular-nums; }
    .col-progress-track { height: 3px; margin-top: 0.3rem; background: var(--divider-sand); border-radius: 2px; overflow: hidden; }
    .col-progress-fill { height: 100%; width: 0; background: var(--structural); transition: width 0.12s linear; }

    @media (max-width: 640px) {
      .hud-nav-btn { padding: 0.4rem 0.65rem; gap: 0.35rem; }
      .hud-nav-label { font-size: 0.76rem; }
      .hud-slot-cap { font-size: 0.66rem; }
    }
  </style>
