<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="meta-title">Steps of Muhammad</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Cross-fade for the spiritual emblem transformation */
    .emblem-container:hover .base-flag { opacity: 0; }
    .emblem-container:hover .nur-flag { opacity: 1; scale: 1.05; }
    .emblem-container:active .base-flag { opacity: 0; }
    .emblem-container:active .nur-flag { opacity: 1; scale: 1.05; }

    /* Modal Animation States resembling phone OS zoom scaling */
    .folder-modal {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.9);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .folder-modal.open {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }

    /* Smooth localized scrollbar aesthetics */
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(5, 20, 11, 0.6);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(16, 185, 129, 0.2);
      border-radius: 2px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(52, 211, 153, 0.4);
    }
  </style>
</head>
<body class="bg-[#05140b] text-emerald-50 min-h-screen flex flex-col justify-between antialiased selection:bg-emerald-500/30 relative overflow-x-hidden">

  <div id="yt-audio-player" class="hidden"></div>

  <!-- ── CENTRALIZED, APPARENT FIXED BACKGROUND NALAYN ENGINE ── -->
  <div class="fixed inset-0 -z-10 flex items-center justify-center pointer-events-none select-none overflow-hidden">
    <img 
      id="bg-base"
      src="./Black Flag.jpeg" 
      alt="Nalayn Shareef - Base State" 
      class="w-full max-w-sm md:max-w-md h-auto object-contain transition-all duration-1000 ease-in-out opacity-40 saturate-[0.85]"
    />
    <img 
      id="bg-nur"
      src="./Black Flag (nur).jpeg" 
      alt="Nalayn Shareef - Filled with Nur" 
      class="absolute w-full max-w-sm md:max-w-md h-auto object-contain transition-all duration-1000 ease-in-out opacity-0 scale-105"
    />
    <div class="absolute inset-0 bg-gradient-to-t from-[#05140b] via-[#05140b]/75 to-[#05140b]/90"></div>
    <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,transparent_20%,#05140b_75%)]"></div>
  </div>

  <main class="flex-1 flex flex-col items-center justify-start p-4 min-w-0 relative z-10 w-full max-w-md mx-auto">
    
    <!-- Top Identity / Trigger Module -->
    <div class="space-y-3 flex flex-col items-center text-center pt-6 pb-4 w-full select-none">
      <div id="emblem-trigger" 
           onmouseenter="igniteNur()" 
           onmouseleave="extinguishNur()"
           class="emblem-container relative w-24 h-24 rounded-full overflow-hidden border border-emerald-900/60 shadow-2xl transition-all duration-500 cursor-pointer group hover:border-emerald-500/50 hover:shadow-emerald-500/10">
        <img src="./Black Flag.jpeg" alt="Base State" class="base-flag absolute inset-0 w-full h-full object-cover opacity-100 transition-all duration-700 ease-in-out" />
        <img src="./Black Flag (nur).jpeg" alt="Filled with Nur" class="nur-flag absolute inset-0 w-full h-full object-cover opacity-0 transition-all duration-700 ease-in-out" />
        <div class="absolute inset-0 ring-1 ring-inset ring-emerald-400/20 rounded-full pointer-events-none group-hover:ring-emerald-400/50 transition-all duration-500"></div>
      </div>

      <div class="space-y-1">
        <h1 id="root-title" class="text-xl md:text-2xl font-black tracking-widest bg-gradient-to-r from-emerald-400 via-teal-300 to-amber-400 bg-clip-text text-transparent uppercase">
          Follow the steps
        </h1>
        <p id="root-subtitle" class="text-[10px] font-mono text-emerald-600 uppercase tracking-widest max-w-md mx-auto">
          Prophet Muhammad ﷺ
        </p>
      </div>
    </div>

    <!-- ── OPTIMIZED 3-COLUMN USER-MAPPED GRID SYSTEM ── -->
    <div id="homescreen-grid" class="w-full grid grid-cols-3 gap-y-8 gap-x-4 px-2 py-6 flex-1 items-start content-start">
      <!-- Injected elegantly via the manual coordinate engine mapping layout below -->
    </div>

  </main>

  <!-- ── FOLDER OVERLAY INTERACTIVE MODAL PANEL ── -->
  <div id="portal-modal-backdrop" class="fixed inset-0 bg-black/70 backdrop-blur-md z-50 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300">
    <div id="portal-modal-content" class="folder-modal w-full max-w-xs bg-[#071c10]/95 border border-emerald-800/40 rounded-3xl p-5 shadow-2xl flex flex-col space-y-4">
      
      <!-- Folder Info Header -->
      <div class="flex items-start justify-between border-b border-emerald-950 pb-2">
        <div>
          <h3 id="modal-folder-title" class="text-sm font-bold font-mono tracking-wider text-amber-300 uppercase">Folder Name</h3>
          <p id="modal-folder-desc" class="text-[10px] text-emerald-400/60 leading-tight pt-0.5">Folder Description Details</p>
        </div>
        <button onclick="closeActiveFolderModal()" class="w-6 h-6 rounded-full bg-emerald-950 border border-emerald-800 flex items-center justify-center text-xs text-emerald-400 hover:text-amber-400 transition-colors">&times;</button>
      </div>

      <!-- Scrollable Document Links Grid inside Folder Window -->
      <div id="modal-links-container" class="max-h-72 overflow-y-auto space-y-1.5 pr-1">
        <!-- Injected via JavaScript Engine execution -->
      </div>
    </div>
  </div>

  <footer class="w-full text-center text-[9px] text-emerald-800/80 font-mono tracking-widest uppercase pb-4 select-none relative z-10">
    Compiled for ✦ the foam of the seas
  </footer>

  <script>
    const ROOT_CONFIG = {
      title: "Follow the steps of",
      subtitle: "Prophet Muhammad ﷺ",
      youtubeAudioId: "8hTUDQEvqk8"
    };

    // =========================================================
    // VAULT DATA WITH PRECISE ROW/COL COORDINATE MATRIX (1-Based)
    // Grid: 3 Columns, 4 Rows max
    // =========================================================
    const VAULT_NAVIGATION_TREE = [
      {
        category: "Solat Seals",
        desc: "Prophetic Dua right after solat",
        icon: "📿",
        row: 1, col: 1, // Row 1, Column 1
        items: [
          { label: "1) Istighfar + Source of Peace", path: "after solat/1_Istighfar_peace.html"},
          { label: "2a) Tahlil - Facing Spiritual Lethargy / Hostility", path: "after solat/2a_tahlil.html" },
          { label: "2b) Tahlil - Facing Financial Anxiety / Decisions", path: "after solat/2b_tahlil.html" },
          { label: "Dua: Protect me from Hellfire", path: "after solat/dua-allahuma-ajirnaar.html" },
        ]
      },
      {
        category: "Heart Anchors",
        desc: "Prophetic Dua for anchoring and aligning to the divine command",
        icon: "❤️",
        row: 1, col: 2, // Row 1, Column 2
        items: [
          { label: "Dua: Oh Turner of Hearts...", path: "dua-general/dua-turner-of-hearts.html" },
          { label: "Dua: In the Greatest of Names", path: "dua-general/dua-greatest-of-names.html" },
          { label: "Dua: Istikhara - Guidance", path: "dua-general/dua-istikhara.html" },
          { label: "Dua: Aisyah's Comprehensive Ask", path: "dua-general/dua-comprehensive-aisyah.html" },
          { label: "Dua Set: Habeeb Umar", path: "dua-general/dua-habeeb-umar.html"}
        ]
      },
      {
        category: "Work & Travel",
        desc: "Prophetic invigoration evocations for movement and execution",
        icon: "💼",
        row: 2, col: 1, // Row 2, Column 1
        items: [
          { label: "Dua - Ease of Work Matrix", path: "dua-work/dua-la-sahlan.html" },
          { label: "Dua - Travel Safeguards", path: "/dua-work/travel.html"}
        ]
      },
      {
        category: "Sacred Months",
        desc: "Dhikr / Wird metrics linked to sacred windows",
        icon: "🌙",
        row: 2, col: 2, // Row 2, Column 2
        items: [
          { label: "Takbir Eid ul Adha", path: "/Dua Haj/takbir-eiduladha.html" },
          { label: "Dua: Prophets Best Arafah Evocation", path: "Dua Haj/dua-prophets-made-on-arafah.html" },
          { label: "Dua: Ali & Ibn Umar during Arafah", path: "Dua Haj/dua-sahabah-made-on-arafah.html" },
          { label: "Dua Collection: Dhul Hijjah - Top 10 Days", path: "Dua Haj/Amalan Haj.html" },
          { label: "Dua Collection: Istighfar Rajab", path: "Wird/istighfar-rajab.html" },
        ]
      },
      {
        category: "Shifa & Healing",
        desc: "Prophetic restorative structural evocations",
        icon: "🌱",
        row: 2, col: 3, // Row 2, Column 3
        items: [
          { label: "Seeking Wellness Against Physical Ailments", path: "Dua Shifa/dua-shifa.html" },
          { label: "Full Ruqyah for Specialized Pain", path: "Dua Shifa/Ruqyah.html" }
        ]
      },
      {
        category: "Morning Adhkar",
        desc: "Morning protective adhkar formulas (Sunup Radial)",
        icon: "☀️",
        row: 3, col: 1, // Row 3, Column 1 (Bottom Left)
        items: [
          { label: "🤲🏽🛡 Protection: Harm/Patience Tests", path: "/start and end of day/evoke shield against harm.html" },
          { label: "Dua Fatimah - Listen to Your Advice", path: "start and end of day/listen-to-my-advice-ya-hayyu-ya-qayyum.html" },
        ]
      },
      {
        category: "Evening Adhkar",
        desc: "Evening protective shielding formulas (Sundown Radial)",
        icon: "🌙",
        row: 3, col: 3, // Row 3, Column 3 (Bottom Right)
        items: [
          { label: "🤲🏽🛡 Protection: Internal Weakness + Oppression", path: "dua-general/daily-dhikr-internal-weakness-external-oppression.html" },
          { label: "Sayyidul-Istighfar: Chief of Forgiveness", path: "start and end of day/sayyidul-istighfar.html"},
        ]
      }
    ];

    // 🏗️ COORDINATE-AWARE PHONE HOMESCREEN ARCHITECTURE BUILDER ENGINE
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById('meta-title').textContent = ROOT_CONFIG.title;
      document.getElementById('root-title').textContent = ROOT_CONFIG.title;
      document.getElementById('root-subtitle').textContent = ROOT_CONFIG.subtitle;
      
      const gridTarget = document.getElementById('homescreen-grid');
      let gridHTML = '';

      const MAX_COLS = 3;
      const MAX_ROWS = 4; // Allocates structural headroom for layout safety

      // Iterate systematically through logical grid cells
      for (let r = 1; r <= MAX_ROWS; r++) {
        for (let c = 1; c <= MAX_COLS; c++) {
          
          // Match array element explicitly asserting these coordinates
          const folderIndex = VAULT_NAVIGATION_TREE.findIndex(f => f.row === r && f.col === c);
          const currentData = VAULT_NAVIGATION_TREE[folderIndex];

          if (currentData) {
            // Build the mini preview icon matrix inside the application container
            let folderPreviews = '';
            for (let previewItemIndex = 0; previewItemIndex < 4; previewItemIndex++) {
              const item = currentData.items[previewItemIndex];
              folderPreviews += `
                <div class="bg-emerald-950/80 border border-emerald-900/30 rounded flex items-center justify-center text-[10px] font-mono select-none overflow-hidden text-emerald-400">
                  ${item ? currentData.icon : ''}
                </div>`;
            }

            gridHTML += `
              <div onclick="openFolderModal(${folderIndex})" class="flex flex-col items-center space-y-2 cursor-pointer group active:scale-95 transition-all text-center">
                
                <!-- Expanded Phone App Folder Design -->
                <div class="w-16 h-16 bg-[#092213]/50 border border-emerald-900/40 backdrop-blur-md rounded-2xl p-2.5 grid grid-cols-2 grid-rows-2 gap-1.5 group-hover:border-emerald-500/40 group-hover:bg-[#0c2e1a]/70 shadow-xl transition-all duration-200">
                  ${folderPreviews}
                </div>

                <!-- Fully Viewable Label Wrappers (Zero Truncation) -->
                <span class="text-[11px] font-semibold tracking-wide text-emerald-200 group-hover:text-amber-300 transition-colors font-sans px-1 leading-snug break-words max-w-[100px]">
                  ${currentData.category}
                </span>
              </div>`;
          } else {
            // Render structured spacer tags to correctly retain programmatic row tracking bounds
            gridHTML += `<div class="w-16 h-16 rounded-2xl border border-transparent pointer-events-none select-none"></div>`;
          }
        }
      }

      gridTarget.innerHTML = gridHTML;
      initAudioEngine();
    });

    // ── INTERACTIVE PHONE VIEW ACTIONS ──
    function openFolderModal(index) {
      const folder = VAULT_NAVIGATION_TREE[index];
      if (!folder) return;

      document.getElementById('modal-folder-title').textContent = folder.category;
      document.getElementById('modal-folder-desc').textContent = `-- ${folder.desc}`;

      const container = document.getElementById('modal-links-container');
      container.innerHTML = folder.items.map(item => `
        <a href="./${item.path}" 
           onmouseenter="igniteNur()" 
           onmouseleave="extinguishNur()"
           class="flex items-center gap-2.5 p-2.5 rounded-xl text-xs font-medium text-emerald-200 bg-[#092213]/40 border border-emerald-900/20 hover:text-amber-300 hover:bg-[#0c2e1a]/80 hover:border-emerald-500/20 transition-all group">
          <span class="text-emerald-700 group-hover:text-amber-500 font-mono select-none">${folder.icon}</span>
          <span class="leading-snug text-left">${item.label}</span>
        </a>
      `).join('');

      const backdrop = document.getElementById('portal-modal-backdrop');
      const content = document.getElementById('portal-modal-content');
      backdrop.classList.remove('opacity-0', 'pointer-events-none');
      content.classList.add('open');
    }

    function closeActiveFolderModal() {
      const backdrop = document.getElementById('portal-modal-backdrop');
      const content = document.getElementById('portal-modal-content');
      backdrop.classList.add('opacity-0', 'pointer-events-none');
      content.classList.remove('open');
    }

    document.getElementById('portal-modal-backdrop').addEventListener('click', (e) => {
      if (e.target === document.getElementById('portal-modal-backdrop')) closeActiveFolderModal();
    });

    function initAudioEngine() {
      var tag = document.createElement('script');
      tag.src = "https://www.youtube.com/iframe_api";
      var firstScriptTag = document.getElementsByTagName('script')[0];
      firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
    }

    var player;
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('yt-audio-player', {
        height: '0', width: '0', videoId: ROOT_CONFIG.youtubeAudioId,
        playerVars: { 'autoplay': 0, 'controls': 0, 'loop': 1, 'playlist': ROOT_CONFIG.youtubeAudioId },
        events: { 'onReady': () => {
          const trigger = document.getElementById('emblem-trigger');
          trigger.addEventListener('mouseenter', () => player.playVideo());
          trigger.addEventListener('touchstart', () => player.playVideo());
        }}
      });
    }

    function igniteNur() {
      const baseFlag = document.getElementById('bg-base');
      const nurFlag = document.getElementById('bg-nur');
      if (baseFlag && nurFlag) {
        baseFlag.style.opacity = '0';
        nurFlag.style.opacity = '0.75';
        nurFlag.style.transform = 'scale(1.03)';
      }
      document.querySelector('.base-flag').style.opacity = '0';
      document.querySelector('.nur-flag').style.opacity = '1';
      if (player && typeof player.playVideo === 'function') player.playVideo();
    }

    function extinguishNur() {
      const baseFlag = document.getElementById('bg-base');
      const nurFlag = document.getElementById('bg-nur');
      if (baseFlag && nurFlag) {
        baseFlag.style.opacity = '0.40';
        nurFlag.style.opacity = '0';
        nurFlag.style.transform = 'scale(1.0)';
      }
      document.querySelector('.base-flag').style.opacity = '1';
      document.querySelector('.nur-flag').style.opacity = '0';
    }
  </script>
</body>
</html>
