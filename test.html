<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Muslim Warrior RPG</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050510;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
        }
        h1 {
            margin: 0 0 5px 0;
            font-size: 24px;
            color: #ffd700;
            letter-spacing: 1px;
        }
        .controls-hint {
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 15px;
            border-radius: 5px;
            border-left: 4px solid #009688;
            font-size: 14px;
        }
        #loading {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffd700;
            font-size: 24px;
            z-index: 99;
            transition: opacity 0.5s;
        }
    </style>
    <!-- Import Three.js Engine from CDN -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

<div id="loading">Assembling the Desert Realm...</div>

<div id="ui-layer">
    <h1>⚔️ Desert Warrior RPG</h1>
    <div class="controls-hint">
        <strong>Character:</strong> Muslim Vanguard<br>
        <strong>Move:</strong> Use Arrow Keys or WASD<br>
        <strong>Objective:</strong> Traverse the golden sands
    </div>
</div>

<script>
    // --- 1. SETUP ENGINE & SCENE ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xdce6f2); // Day sky tint
    scene.fog = new THREE.FogExp2(0xdce6f2, 0.015);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // --- 2. LIGHTING ---
    const ambientLight = new THREE.AmbientLight(0xfff0e0, 0.6);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xffe5cc, 1.2);
    sunLight.position.set(40, 60, 20);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    scene.add(sunLight);

    // --- 3. ENVIRONMENT (DESERT DUNES) ---
    const floorGeo = new THREE.PlaneGeometry(500, 500, 64, 64);
    floorGeo.rotateX(-Math.PI / 2);
    
    // Displace vertices to form natural rolling sand dunes
    const pos = floorGeo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
        let x = pos.getX(i);
        let z = pos.getZ(i);
        let y = Math.sin(x * 0.05) * Math.cos(z * 0.05) * 2.5 + Math.sin(x * 0.01) * 5;
        pos.setY(i, y);
    }
    floorGeo.computeVertexNormals();

    const floorMat = new THREE.MeshStandardMaterial({ 
        color: 0xdfb76c, // Golden desert sand
        roughness: 0.9,
        metalness: 0.1
    });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.receiveShadow = true;
    scene.add(floor);

    // --- 4. PLAYER CREATION (MUSLIM WARRIOR ARCHETYPE) ---
    // Composite 3D model grouping utilizing geometric styling primitives
    const warriorGroup = new THREE.Group();

    // Boots / Base
    const bootMat = new THREE.MeshStandardMaterial({ color: 0x3d2314, roughness: 0.8 });
    const leftBoot = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.3, 0.6), bootMat);
    leftBoot.position.set(-0.35, 0.15, 0);
    const rightBoot = leftBoot.clone();
    rightBoot.position.x = 0.35;
    warriorGroup.add(leftBoot, rightBoot);

    // Robes (Traditional Emerald Green Tunic / Khalat)
    const robeMat = new THREE.MeshStandardMaterial({ color: 0x06633b, roughness: 0.7 }); // Emerald
    const goldTrimMat = new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.7, roughness: 0.3 }); // Gold
    
    const tunic = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.9, 1.8, 8), robeMat);
    tunic.position.y = 1.1;
    tunic.castShadow = true;
    warriorGroup.add(tunic);

    // Golden Waist Sash / Belt
    const belt = new THREE.Mesh(new THREE.CylinderGeometry(0.65, 0.67, 0.2, 8), goldTrimMat);
    belt.position.y = 1.2;
    warriorGroup.add(belt);

    // Head Armor (Traditional Steel Conical Helmet with Golden Spire)
    const steelMat = new THREE.MeshStandardMaterial({ color: 0x70777a, metalness: 0.8, roughness: 0.2 });
    
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.4, 16, 16), new THREE.MeshStandardMaterial({ color: 0xe0ac69 }));
    head.position.y = 2.2;
    warriorGroup.add(head);

    const helmetBase = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.2, 16), steelMat);
    helmetBase.position.y = 2.3;
    
    const helmetSpire = new THREE.Mesh(new THREE.ConeGeometry(0.42, 0.5, 16), steelMat);
    helmetSpire.position.y = 2.55;

    const helmetTip = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.05, 0.2, 8), goldTrimMat);
    helmetTip.position.y = 2.85;

    warriorGroup.add(helmetBase, helmetSpire, helmetTip);

    // Scimitar Sword (Sheathed on Side)
    const scimitarGroup = new THREE.Group();
    const blade = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.8, 0.15), steelMat);
    blade.rotation.z = -0.2; 
    const hilt = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.05, 0.2), goldTrimMat);
    hilt.position.y = 0.4;
    scimitarGroup.add(blade, hilt);
    scimitarGroup.position.set(-0.8, 1.1, 0.2);
    scimitarGroup.rotation.y = Math.PI / 4;
    warriorGroup.add(scimitarGroup);

    // Spawn player in scene
    warriorGroup.position.set(0, 0, 0);
    scene.add(warriorGroup);

    // Remove loading overlay screens once construction completes
    document.getElementById('loading').style.opacity = 0;
    setTimeout(() => document.getElementById('loading').remove(), 500);

    // --- 5. INPUT CONTROLS ---
    const keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };
    
    window.addEventListener('keydown', (e) => { if (e.key in keys) keys[e.key] = true; });
    window.addEventListener('keyup', (e) => { if (e.key in keys) keys[e.key] = false; });

    // --- 6. GAME LOOP & MOVEMENT MATH ---
    const clock = new THREE.Clock();
    const moveSpeed = 7.0;
    const rotationSpeed = 4.0;

    function updateGame() {
        const delta = clock.getDelta();

        // Interpret directional inputs
        const forward = keys.w || keys.ArrowUp;
        const backward = keys.s || keys.ArrowDown;
        const left = keys.a || keys.ArrowLeft;
        const right = keys.d || keys.ArrowRight;

        // Rotation logic
        if (left) {
            warriorGroup.rotation.y += rotationSpeed * delta;
        }
        if (right) {
            warriorGroup.rotation.y -= rotationSpeed * delta;
        }

        // Translation forward/backward along local vector matrices
        if (forward) {
            warriorGroup.translateZ(moveSpeed * delta);
        }
        if (backward) {
            warriorGroup.translateZ(-moveSpeed * delta);
        }

        // Simple dynamic Y-clamping relative to landscape heights
        let currentX = warriorGroup.position.x;
        let currentZ = warriorGroup.position.z;
        let terrainHeight = Math.sin(currentX * 0.05) * Math.cos(currentZ * 0.05) * 2.5 + Math.sin(currentX * 0.01) * 5;
        warriorGroup.position.y = terrainHeight;

        // Smooth Third-Person Camera follow configuration
        const relativeCameraOffset = new THREE.Vector3(0, 4, -8); // Behind and above
        const cameraOffset = relativeCameraOffset.applyMatrix4(warriorGroup.matrixWorld);
        
        camera.position.x = THREE.MathUtils.lerp(camera.position.x, cameraOffset.x, 0.1);
        camera.position.y = THREE.MathUtils.lerp(camera.position.y, cameraOffset.y, 0.1);
        camera.position.z = THREE.MathUtils.lerp(camera.position.z, cameraOffset.z, 0.1);
        camera.lookAt(warriorGroup.position.x, warriorGroup.position.y + 1.5, warriorGroup.position.z);
    }

    function animate() {
        requestAnimationFrame(animate);
        updateGame();
        renderer.render(scene, camera);
    }

    // --- 7. HANDLE WINDOW RESIZING ---
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Fire application runtime
    animate();
</script>

</body>
</html>
